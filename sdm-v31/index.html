<meta charset="utf-8">
<title>SDM AL-WILDAN</title>
<meta name="description" content="Sistem monitoring & manajemen HRIS AL-WILDAN ISLAMIC SCHOOL HOLDING">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ===== LIGHT-ONLY (PaceUI-style, terang) ===== */
:root{
  color-scheme:light;
  --bg:#f4f6f8; --bg-2:#eef1f4;
  --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f4f7;
  --line:#e3e8ee; --line-2:#eef2f6;
  --ink:#141a20; --ink-2:#55606c; --ink-3:#8a95a1;
  --brand:#1F4E79; --brand-2:#1F4E79;
  --c1:#2f6cb0; --c2:#c77400; --c3:#149a63; --c4:#7b5fd0; --c5:#c23a5c; --c6:#0d8fb0;
  --pos:#16a34a; --pos-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fbf1e2; --neg:#c00000; --neg-bg:#fbeaea; --info:#1F4E79; --info-bg:#eaf1f8;
  --grid:#e8edf2; --track:#eef2f6;
  --shadow:0 1px 2px rgba(16,32,45,.05),0 6px 18px rgba(16,32,45,.07);
  --radius:12px; --radius-sm:9px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
a{color:var(--brand)}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.scrim{display:none}

/* ===== SIDEBAR ===== */
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.brand .logo img{width:28px;height:28px;object-fit:contain}
.brand .t1{font-weight:800;font-size:14px;letter-spacing:.2px;line-height:1.1}
.brand .t2{font-size:10px;opacity:.6;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);padding:14px 10px 5px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:var(--ink-2);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .12s}
.nav button svg{width:17px;height:17px;flex:none;opacity:.8}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--surface-3);color:var(--ink);font-weight:600}
.nav button.active svg{opacity:1;color:var(--brand)}
.side-foot{margin-top:auto;padding:14px 16px;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--line);line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 20px}
.crumb{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.crumb b{color:var(--ink);font-weight:700}
.topbar .ttl{font-size:16px;font-weight:800;line-height:1.1}
.topbar .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;width:14px;height:14px;color:var(--ink-3)}
.search input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px 8px 30px;font-size:12.5px;width:220px;color:var(--ink);font-family:inherit}
.search input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}
.burger{display:none}
.content{padding:20px;max-width:1360px;width:100%}

/* ===== PRIMITIVES ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .lbl{font-size:11.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:7px}
.tile .lbl .dot{width:7px;height:7px;border-radius:2px}
.tile .val{font-size:25px;font-weight:800;margin-top:9px;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.tile .val.money{font-size:20px}
.tile .row2{display:flex;align-items:center;gap:8px;margin-top:5px}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px}
.trend svg{width:11px;height:11px}
.trend.up{color:var(--pos);background:var(--pos-bg)}
.trend.down{color:var(--neg);background:var(--neg-bg)}
.trend.flat{color:var(--ink-2);background:var(--surface-2)}
.tile .meta{font-size:11px;color:var(--ink-3)}
.tile.clickable{transition:transform .12s,box-shadow .12s,border-color .12s}
.tile.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,78,121,.14);border-color:var(--brand)}
.tile-go{margin-left:auto;color:var(--ink-3);font-weight:700;transition:transform .12s}
.tile.clickable:hover .tile-go{transform:translateX(3px);color:var(--brand)}
.tile .lbl{display:flex}
/* search dropdown */
.search-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 40px rgba(16,32,45,.16);max-height:340px;overflow:auto;z-index:40}
.search-dd .sdh{padding:7px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700;background:var(--surface-2);position:sticky;top:0}
.search-dd .sdi{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:12.5px}
.search-dd .sdi:hover{background:var(--surface-2)}
.search-dd .sdi .avatar{width:28px;height:28px;font-size:10px}
.search-dd .sdi .nm{font-weight:700}
.search-dd .sdi .sm{font-size:11px;color:var(--ink-3)}
.search{position:relative}

.sec-h{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
.sec-h h2{font-size:14px}
.sec-h .hint{font-size:11.5px;color:var(--ink-3);margin-left:auto}

.panel{padding:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-h h3{font-size:13.5px}
.panel-h h3 svg{width:15px;height:15px;vertical-align:-3px;margin-right:2px}
.modal-sec svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
/* any inline icon inside prose/notes must stay small */
.card p svg, .card div svg.inl, p svg{width:14px;height:14px;vertical-align:-2px}
.note-inline svg{width:15px;height:15px;vertical-align:-3px;flex:none}
.panel-h .hint{font-size:11px;color:var(--ink-3);margin-left:auto}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:12px}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}
.legend-inline i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:10px;font-size:12px}
.bar-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:var(--track);border-radius:5px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;min-width:3px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.bar-row .vv{text-align:right;color:var(--ink);font-weight:700}

/* ring meter grid */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.meter{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.meter .ml{font-size:11.5px;color:var(--ink-2);font-weight:600}
.meter .mn{font-size:10.5px;color:var(--ink-3)}

/* donut legend */
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .li .n{color:var(--ink-2)}
.legend .li .v{margin-left:auto;font-weight:700;color:var(--ink)}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 13px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th .ar{opacity:.4;font-size:9px;margin-left:3px}
tbody td{padding:10px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.emp-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.avatar{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--surface-3);flex:none;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:11px;border:1px solid var(--line)}
.emp-cell .nm{font-weight:700;line-height:1.2;color:var(--ink)}
.emp-cell .sm{font-size:11px;color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.pos{background:var(--pos-bg);color:var(--pos)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neg{background:var(--neg-bg);color:var(--neg)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.grey{background:var(--surface-3);color:var(--ink-2)}

.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:12px;font-family:inherit}

.paginate{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 2px;font-size:12px;color:var(--ink-2)}
.paginate button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600}
.paginate button:disabled{opacity:.4;cursor:default}

.dev{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:11px;padding:11px 14px;font-size:12px;color:var(--ink-2);margin-bottom:16px}
.dev svg{width:16px;height:16px;color:var(--warn);flex:none;margin-top:1px}
.dev b{color:var(--ink)}

/* tooltip */
.chart-tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.chart-tip .tt{color:var(--ink-3);font-size:10.5px;margin-bottom:2px}
.chart-tip b{font-weight:800}

/* svg chart common */
.svgchart{width:100%;height:auto;display:block;overflow:visible}
.svgchart .gl{stroke:var(--grid);stroke-width:1}
.svgchart .axl{fill:var(--ink-3);font-size:10px}
.hoverbar:hover{opacity:.82;cursor:default}
.cx-line{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.cx-tag{fill:var(--brand)}
.cx-tagt{fill:#fff;font-size:10px;font-weight:700}
.ac-wrap .ac-tip{position:absolute;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:11.5px;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .1s;pointer-events:none;white-space:nowrap;z-index:5}
.ac-tip .tt{color:var(--ink-3);font-size:10px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.ac-tip .dotc{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.ac-tip b{font-variant-numeric:tabular-nums}
.ac-tip .chg{margin-top:4px;font-size:10.5px;font-weight:700}
.ac-tip .chg.up{color:var(--pos)}.ac-tip .chg.dn{color:var(--neg)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid var(--line)}
.modal-h{padding:18px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h .avatar{width:52px;height:52px;font-size:17px;border-radius:11px}
.modal-h .nm{font-size:16px;font-weight:800}
.modal-h .rl{font-size:12px;color:var(--ink-3);margin-top:2px}
.modal-h .x{margin-left:auto;border:0;background:var(--surface-2);width:31px;height:31px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:17px;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);padding:1px}
.kv .k{background:var(--surface);padding:10px 13px}
.kv .k .l{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kv .k .v{font-size:13px;font-weight:600;margin-top:3px;word-break:break-word;color:var(--ink)}
.modal-sec{padding:8px 18px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);font-weight:800;background:var(--surface-2)}

/* payslip */
.slip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.slip-h{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.slip-h .t{font-weight:800;font-size:15px}
.slip-h .s{font-size:11.5px;opacity:.85;margin-top:2px}
.slip-body{padding:18px}
.slip-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.slip-row.head{font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:6px}
.slip-row.total{border-top:2px solid var(--brand);border-bottom:0;font-weight:800;font-size:14px;margin-top:6px;padding-top:11px;color:var(--brand)}
.slip-2col{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ticket */
.tk-lane{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.tk-lane-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;padding:2px 4px}
.tk-lane-h .c{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--ink-2)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow)}
.tk .id{font-size:10px;color:var(--ink-3);font-weight:700;letter-spacing:.5px}
.tk .ti{font-weight:700;font-size:12.5px;margin:4px 0 8px;line-height:1.3;color:var(--ink)}
.tk .ft{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.prio{width:7px;height:7px;border-radius:50%;flex:none}

/* ===== LOGIN ===== */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#eaf1fb,#dde7f4 55%,#cdd9ea)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(16,32,45,.18);width:100%;max-width:400px;overflow:hidden}
.login-head{background:linear-gradient(135deg,#1F4E79,#2f6cb0);color:#fff;padding:26px 26px 22px;text-align:center}
.login-head img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:12px;padding:5px}
.login-head .t{font-weight:800;font-size:17px;margin-top:12px}
.login-head .s{font-size:12px;opacity:.85;margin-top:3px}
.login-body{padding:24px}
.login-body .field{margin-bottom:14px}
.login-body .btn{width:100%;justify-content:center;padding:12px}
.login-err{background:var(--neg-bg);color:var(--neg);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:center}

.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:11px}
/* employee landing */
.emp-hero{background:linear-gradient(135deg,#1F4E79,#2f6cb0);color:#fff;border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:var(--shadow)}
.emp-hero .avatar{width:66px;height:66px;font-size:22px;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3)}
.emp-hero .nm{font-size:20px;font-weight:800}
.emp-hero .rl{font-size:13px;opacity:.9;margin-top:3px}
.emp-hero .st{margin-left:auto;text-align:right}
.emp-hero .clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.checkin-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:2px}
.checkin-btn{border:0;border-radius:12px;padding:16px 26px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:var(--pos);box-shadow:0 6px 18px rgba(22,163,74,.3);display:flex;align-items:center;gap:9px}
.checkin-btn.out{background:var(--c2);box-shadow:0 6px 18px rgba(199,116,0,.3)}
.checkin-btn:disabled{background:var(--ink-3);box-shadow:none;cursor:default}
.emp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:1px solid var(--line);padding-bottom:0}
.emp-tab{border:0;background:transparent;color:var(--ink-2);padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.emp-tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.acct-tbl code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:11px}
/* role picker (subscription-style cards) */
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role-card{border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:all .15s;background:var(--surface);position:relative;display:flex;flex-direction:column}
.role-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 28px rgba(31,78,121,.12)}
.role-card.sel{border-color:var(--brand);background:var(--info-bg)}

async function apiFetch(path, opts){
 const init=opts||{};
 init.credentials='include';
 if(init.body && !init.headers) init.headers={'Content-Type':'application/json'};
 const r=await fetch(path,init);
 let data=null;try{data=await r.json()}catch(e){}
 if(!r.ok){const err=new Error((data&&data.error)||('HTTP '+r.status));err.status=r.status;err.data=data;throw err;}
 return data;
}

async function parsePdfFile(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let text='';
 for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
   // reconstruct lines by y
   let last=null,line='';const lines=[];
   c.items.forEach(it=>{const y=Math.round(it.transform[5]);if(last!==null&&Math.abs(y-last)>4){lines.push(line);line='';}line+=(line?' ':'')+it.str;last=y;});
   if(line)lines.push(line);text+=lines.join('\n')+'\n';}
 return text;}

function heatmap(rowLabels,colLabels,matrix,drill){let mx=1;matrix.forEach(r=>r.forEach(v=>{if(v>mx)mx=v;}));
 // gradasi merah: merah muda -> merah tua (standar warna AL-WILDAN)
 const redScale=t=>{const stops=[[255,240,240],[250,205,205],[240,150,150],[222,90,90],[192,0,0],[140,0,0]];const p=Math.max(0,Math.min(1,t))*(stops.length-1);const i=Math.floor(p),f=p-i;const a=stops[i],b=stops[Math.min(i+1,stops.length-1)];return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;};
 const cell=(v,ri,ci)=>{const t=v/mx;const bg=v===0?'var(--track)':redScale(0.12+t*0.88);
   const clk=drill?` onclick="drillHeat('${drill}','${esc(rowLabels[ri])}','${esc(colLabels[ci])}')" style="cursor:pointer"`:'';
   return `<div class="hm-cell hoverbar" data-tip="${esc(rowLabels[ri])} · ${esc(colLabels[ci])}: ${v} bergabung"${clk} style="background:${bg}">${v>0?`<span style="color:${t>0.42?'#fff':'#7a1414'}">${v}</span>`:''}</div>`;};

   ${rowLabels.map((rl,ri)=>`<div class="hm-rl">${esc(rl)}</div>`+matrix[ri].map((v,ci)=>cell(v,ri,ci)).join('')).join('')}

         ${Object.entries(ACTIONS).map(([k,v])=>`<option value="${k}" ${actState.type===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
     ${a.needUnit?`<div class="field" style="margin-top:10px"><label>Cabang Tujuan</label><select id="ac_unit"><option value="">Pilih cabang…</option>${UNITS.filter(u=>u!==e.unit).map(u=>`<option>${esc(u)}</option>`).join('')}</select><span class="hh">Dari <b>${esc(e.unit||'—')}</b> ke cabang baru</span></div>`:''}

     <div class="field" style="margin-top:10px"><label>Alasan / Keterangan</label><textarea id="ac_reason" rows="3" placeholder="Tuliskan alasan, atau akan terisi otomatis dari teks file yang diupload…"></textarea></div>
     <div class="field" style="margin-top:10px"><label>Lampiran Dokumen (SK / Surat Resign / PTDH) — PDF</label>

       <input type="file" id="ac_file" accept="application/pdf" hidden onchange="acReadFile(this.files[0])"></div>
     ${e.riwayat&&e.riwayat.length?`<div style="margin-top:14px"><div class="l" style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:6px">Riwayat SDM</div>${e.riwayat.map(r=>`<div style="font-size:12px;border-left:2px solid var(--brand);padding:2px 0 6px 10px;margin-bottom:4px"><b>${esc(r.aksi)}</b> · ${esc(r.tgl)}<br><span style="color:var(--ink-2)">${esc(r.ket||'')}</span>${r.file?` · 📎 ${esc(r.file)}`:''}</div>`).join('')}</div>`:''}

 closeModalSilent();const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';
 const rs=document.getElementById('ac_reason');if(rs&&actState.reason)rs.value=actState.reason;}

 catch(e){document.getElementById('ac_fname').textContent=file.name+' (nama tersimpan; teks tidak terbaca)';}}
async function applyAction(){const e=actState.emp;const a=ACTIONS[actState.type];const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
 const tgl=g('ac_tgl')||new Date().toISOString().slice(0,10);const ket=g('ac_reason').trim();

 if(a.needJab){const nj=g('ac_jab').trim();if(!nj){toast('Isi jabatan baru',true);return;}payload.jab=nj;}

function buildNetData(){const full=state.netMode==='full';const nodes=[],links=[];
 const hub={id:'HOLDING',label:'AL-WILDAN Holding',type:'hub',col:'#c99a17',count:TOTAL};nodes.push(hub);
 const units=byUnit.slice(0,full?21:16);const maxN=units[0][1]||1;
 units.forEach(([u,n])=>{const rr=10+Math.sqrt(n/maxN)*30;
   const un={id:'U_'+u,label:u,type:'unit',r:rr,col:'#1F4E79',count:n};nodes.push(un);links.push({s:'HOLDING',t:un.id,main:true});
   const emps=DATA.filter(e=>e.unit===u);const take=full?emps.length:Math.min(emps.length,5);
   for(let i=0;i<take;i++){const e=emps[i];const en={id:'E_'+e.id,label:e.nama.split(',')[0],type:'emp',r:4,col:e._local?'#149a63':'#5b8fc9',emp:e};nodes.push(en);links.push({s:un.id,t:en.id});}
 });
 return {nodes,links};}
function initNetwork(){const stage=document.getElementById('netStage');const cv=document.getElementById('netCanvas');if(!cv||!stage)return;
 const data=buildNetData();const N=data.nodes,L=data.links;const idx={};N.forEach((n,i)=>idx[n.id]=i);
 // adjacency for hover highlighting
 const adj={};L.forEach(l=>{(adj[l.s]=adj[l.s]||new Set()).add(l.t);(adj[l.t]=adj[l.t]||new Set()).add(l.s);});
 const dpr=Math.min(devicePixelRatio||1,2);let W=stage.clientWidth,H=stage.clientHeight||480;
 function resize(){W=stage.clientWidth;H=stage.clientHeight||480;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';}
 resize();
 const units=N.filter(n=>n.type==='unit');
 // group employees per unit + assign fixed orbit angle/radius (deterministic, scalable)
 const empByUnit={};N.forEach(n=>{if(n.type==='emp'){const pl=L.find(l=>l.t===n.id);n._pu=pl?pl.s:null;(empByUnit[n._pu]=empByUnit[n._pu]||[]).push(n);}});
 Object.values(empByUnit).forEach(list=>{const cnt=list.length;const perRing=Math.max(6,Math.ceil(Math.sqrt(cnt)*1.6));list.forEach((n,k)=>{const ring=Math.floor(k/perRing);const inRing=k%perRing;n._ea=(inRing/perRing)*Math.PI*2+ring*0.4;n._er=(n._puR||30)+18+ring*13;});});
 units.forEach((u,ui)=>{const a=ui/units.length*Math.PI*2;const rad=Math.min(W,H)*0.34;u.x=W/2+Math.cos(a)*rad;u.y=H/2+Math.sin(a)*rad;u.vx=0;u.vy=0;u._a=a;});
 N.forEach(n=>{if(n.type==='hub'){n.x=W/2;n.y=H/2;}else if(n.type==='emp'){const pu=n._pu?N[idx[n._pu]]:null;n._er=(pu?pu.r:20)+16+ (n._er||0);n.x=(pu?pu.x:W/2)+Math.cos(n._ea)*n._er;n.y=(pu?pu.y:H/2)+Math.sin(n._ea)*n._er;}n.vx=0;n.vy=0;});
 const view={x:0,y:0,k:1};let dragNode=null,panning=false,last=null,hoverNode=null,pulse=0,hi=null;
 NET={view,resize,stop:false,cv,setHi:v=>{hi=v;}};
 const empCount=N.filter(n=>n.type==='emp').length;
 function tick(){if(!NET||NET.stop)return;pulse+=0.02;
   const hub=N[0];hub.x=W/2;hub.y=H/2;

async function sha256(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return 'x'+btoa(unescape(encodeURIComponent(s)));}}
function loadAccts(){return M.accounts||[]}

/* ---- password kuat & unik (12 char, hindari ambigu) ---- */
function randPassword(len){len=len||12;const U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghijkmnpqrstuvwxyz',D='23456789',S='!@#$%*?+';const all=U+L+D+S;
 const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};
 let p=[U[rnd(U.length)],L[rnd(L.length)],D[rnd(D.length)],S[rnd(S.length)]];
 for(let i=p.length;i<len;i++)p.push(all[rnd(all.length)]);
 for(let i=p.length-1;i>0;i--){const j=rnd(i+1);[p[i],p[j]]=[p[j],p[i]];}
 return p.join('');}
/* ---- NIP: AW.<cabang>.<thn masuk>.<urut per cabang+thn> ---- */
function unitCode(u){const m=String(u||'').match(/(\d+)/);if(m)return m[1].padStart(2,'0');const t=String(u||'').toUpperCase();if(t.includes('HOLDING'))return 'HO';if(t.includes('LINTAS'))return 'LX';if(t.includes('YAYASAN'))return 'YY';return 'XX';}
function genNIP(e,taken){const cab=unitCode(e.unit);const thn=/^\d{4}$/.test(e.thnAktif)?e.thnAktif:String(NOW_YEAR);
 // urutan stabil: kumpulkan karyawan di cabang+thn yang sama, urut by id numerik, cari slot pertama yang bebas
 let seq=1;const prefix='AW.'+cab+'.'+thn+'.';
 while(taken&&taken.has(prefix+String(seq).padStart(4,'0')))seq++;
 return prefix+String(seq).padStart(4,'0');}

function parseCSV(text){const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out.map(s=>s.trim());};

 const rows=accs.map(a=>`<tr><td><b>${esc(a.nama||'—')}</b></td><td><code onclick="copyText('${esc(a.nip||'')}')" title="klik salin NIP" style="cursor:pointer">${esc(a.nip||'—')}</code></td><td><code onclick="copyText('${esc(a.u)}')" title="klik salin username" style="cursor:pointer">${esc(a.u)}</code></td><td>${roleLabelFull(a.role)}</td><td>${esc(a.unit||'—')}</td><td style="white-space:nowrap"><button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="copyOneAcct('${esc(a.u)}')">Salin</button> ${a.role!=='master'?`<button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="resetPw('${esc(a.u)}')">Reset Sandi</button> <button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="delAcct('${esc(a.u)}')">Hapus</button>`:'<span style="color:var(--ink-3);font-size:11px">akun utama</span>'}</td></tr>`).join('');
 const noAcc=DATA.filter(e=>!accs.some(a=>a.empId===e.id));
  return `
 <div class="grid tiles">
   ${tile('Total Akun',fmtID.format(accs.length),{color:'var(--c1)',meta:'aktif di sistem'})}
   ${tile('Belum Punya Akun',fmtID.format(noAcc.length),{color:'var(--warn)',meta:'dari '+TOTAL+' karyawan'})}
   ${tile('Admin / HR',fmtID.format(accs.filter(a=>a.role!=='karyawan').length),{color:'var(--c4)',meta:'master + HR cabang'})}
   ${tile('Akun Karyawan',fmtID.format(accs.filter(a=>a.role==='karyawan').length),{color:'var(--c3)'})}
 </div>
 <div class="two-col" style="margin-top:14px">
   <div class="card panel"><div class="panel-h"><h3>${ic('plus')} Buat Akun Tim HR</h3></div>
     <p style="font-size:12.5px;color:var(--ink-2)">Buat akun untuk tim internal HR dengan hak akses berlapis. Pilih peran lewat kartu (gaya paket) lalu sesuaikan izinnya.</p>
     <button class="btn" style="margin-top:12px" onclick="openRolePicker()">${ic('user')} Pilih Peran & Buat Akun</button>
     <div class="note-inline" style="margin-top:14px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start">
       <span style="color:var(--brand);margin-top:1px">${ic('users')}</span><span><b>Guru & Karyawan</b> tidak diatur di sini. Akun mereka dibuat via <b>Data Karyawan</b> / Generate Massal, dengan satu peran <b>Karyawan</b> → otomatis mendapat <b>Portal Karyawan</b> (presensi, slip gaji, profil, pengajuan, helpdesk). Mereka tidak bisa mengelola data orang lain.</span>
     </div>
   </div>
   <div class="card panel"><div class="panel-h"><h3>${ic('users')} Generate Massal (Akun + NIP)</h3></div>
     <p style="font-size:12.5px;color:var(--ink-2)"><b>${noAcc.length}</b> karyawan belum punya akun. Sekali klik: buat akun + <b>password acak unik per orang</b> + <b>NIP</b> otomatis.</p>
     <div class="field" style="max-width:280px;margin-top:10px"><label>Batasi ke cabang (opsional)</label><select id="ac_bulkunit"><option value="">Semua cabang</option>${UNITS.map(u=>`<option>${esc(u)}</option>`).join('')}</select></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
       <button class="btn" onclick="generateBulk()">${ic('users')} Generate Akun + NIP</button>
       <button class="btn ghost" onclick="generateNIPall()">Generate NIP saja</button>
       <button class="btn ghost" onclick="exportAccts()">Ekspor Akun (CSV)</button>
     </div>
     <p style="font-size:11px;color:var(--ink-3);margin-top:8px">Format NIP: <code>AW.&lt;cabang&gt;.&lt;tahun&gt;.&lt;urut&gt;</code> — contoh <code>AW.20.2026.0007</code>. Nomor unik & tersortir per cabang.</p>
   </div>
 </div>
 <div class="sec-h"><h2>Matriks Hak Akses (RBAC)</h2><span class="hint">acuan izin per peran · deskripsi tiap modul</span></div>
 <div class="card panel" style="overflow-x:auto">
   <p style="font-size:12.5px;color:var(--ink-2);margin-bottom:12px">Acuan preset izin untuk tiap peran tim HR. Saat membuat akun, Ustadz bisa menyesuaikan centangnya per modul di modal pilih-peran.</p>
   <table class="acct-tbl" style="width:100%;min-width:600px"><thead><tr><th style="min-width:230px">Modul / Aksi</th><th style="text-align:center">Master</th><th style="text-align:center">KADIV HR</th><th style="text-align:center">Staff HR</th></tr></thead>
   <tbody>${PERMS.map(pm=>{const yn=v=>v?'<span style="color:var(--pos);font-weight:800">✓</span>':'<span style="color:var(--ink-3)">—</span>';
     return `<tr><td><b>${esc(pm.label)}</b><div style="font-size:11px;color:var(--ink-3)">${esc(pm.desc)}</div></td><td style="text-align:center">${yn(true)}</td><td style="text-align:center">${yn(ROLE_PRESET.kadiv_hr[pm.key])}</td><td style="text-align:center">${yn(ROLE_PRESET.staff_hr[pm.key])}</td></tr>`;}).join('')}</tbody></table>
   <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:12px;color:var(--ink-2)">
     <div><b style="color:var(--brand)">Master Admin</b> — akses penuh seluruh sistem, satu-satunya yang menyetujui aktivasi rekrutmen.</div>
     <div><b style="color:var(--brand)">KADIV HR</b> — lihat operasional & semua data karyawan (read-only), respon ticketing, dan <b>full edit rekrutmen</b>. Tidak bisa edit data karyawan / approve.</div>
     <div><b style="color:var(--brand)">Staff HR</b> — hanya lihat proses rekrutmen & aktivasi untuk diajukan; persetujuan aktivasi oleh Master Admin.</div>
   </div>
 </div>
 <div class="sec-h"><h2>Daftar Akun</h2><span class="hint">${accs.length} akun</span></div>
 <div class="tbl-wrap acct-tbl"><table><thead><tr><th>Nama</th><th>NIP</th><th>Username</th><th>Peran</th><th>Unit</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan=6><div class="empty">Belum ada akun.</div></td></tr>'}</tbody></table></div>`;
}
/* ---- role picker modal (subscription-style) ---- */
const ROLE_META={
 kadiv_hr:{name:'KADIV HR',tag:'Kepala Divisi HR',ic:'share',col:'var(--c1)',badge:'PALING LENGKAP'},
 staff_hr:{name:'Staff HR',tag:'Fokus rekrutmen',ic:'userplus',col:'var(--c3)',badge:''},
 master:{name:'Master Admin',tag:'Akses penuh Holding',ic:'lock',col:'var(--c2)',badge:''},
};
let pickRole='kadiv_hr';
function openRolePicker(){pickRole='kadiv_hr';
 const card=(r)=>{const m=ROLE_META[r];const pset=ROLE_PRESET[r];const on=pickRole===r;
   const top=PERMS.filter(p=>pset[p.key]).slice(0,6);const off=PERMS.filter(p=>!pset[p.key]).slice(0,3);
   return `<div class="role-card ${on?'sel':''}" data-role="${r}" onclick="selRole('${r}')">
     ${m.badge?`<div class="rc-badge">${m.badge}</div>`:''}
     <div class="rc-ic" style="background:color-mix(in srgb,${m.col} 15%,transparent);color:${m.col}">${ic(m.ic)}</div>
     <div class="rc-name">${m.name}</div><div class="rc-tag">${m.tag}</div>
     <ul>${top.map(p=>`<li><span class="ck">✓</span>${esc(p.label)}</li>`).join('')}${off.map(p=>`<li><span class="xx">—</span><span style="color:var(--ink-3)">${esc(p.label)}</span></li>`).join('')}</ul>
     <div class="rc-pick">${on?'✓ Terpilih':'Pilih'}</div></div>`;};
 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:820px">
   <div class="modal-h"><div><div class="nm">Pilih Peran Akun Tim HR</div><div class="rl">Pilih paket akses, sesuaikan izin, lalu isi identitas</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div style="padding:18px">
     <div class="role-cards" id="roleCards">${['kadiv_hr','staff_hr','master'].map(card).join('')}</div>
     <div id="roleDetail"></div>
   </div></div></div>`;
 const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';renderRoleDetail();}
function selRole(r){pickRole=r;document.querySelectorAll('#roleCards .role-card').forEach(c=>{const on=c.dataset.role===r;c.classList.toggle('sel',on);c.querySelector('.rc-pick').textContent=on?'✓ Terpilih':'Pilih';});renderRoleDetail();}
function renderRoleDetail(){const d=document.getElementById('roleDetail');if(!d)return;const pset=ROLE_PRESET[pickRole];
 d.innerHTML=`<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px">
   <div class="form-grid">
     <div class="field"><label>Nama Lengkap</label><input id="rp_nama" placeholder="cth: Ahmad Fauzi, S.Psi."></div>
     <div class="field"><label>Username</label><input id="rp_user" placeholder="cth: hr.kadiv"></div>
     <div class="field"><label>Unit / Cabang</label><select id="rp_unit"><option value="Holding">Holding</option>${UNITS.map(u=>`<option>${esc(u)}</option>`).join('')}</select></div>
   </div>
   <details style="margin-top:12px"><summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand)">Sesuaikan izin per modul (kustom) ▾</summary>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:10px">${PERMS.map(pm=>`<label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;cursor:pointer"><input type="checkbox" id="rp_perm_${pm.key.replace(/\./g,'_')}" ${pset[pm.key]?'checked':''} style="width:16px;height:16px;accent-color:var(--brand);margin-top:1px"><span><b>${esc(pm.label)}</b><br><span style="color:var(--ink-3);font-size:11px">${esc(pm.desc)}</span></span></label>`).join('')}</div>
   </details>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="submitRoleAcct()">${ic('lock')} Buat Akun ${roleLabelFull(pickRole)}</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>
 </div>`;}
async function submitRoleAcct(){const g=i=>{const el=document.getElementById(i);return el?el.value.trim():'';};const nama=g('rp_nama'),u=g('rp_user').toLowerCase(),unit=g('rp_unit');
 if(!nama||!u){toast('Nama & username wajib',true);return;}
 const perms=[];PERMS.forEach(pm=>{const cb=document.getElementById('rp_perm_'+pm.key.replace(/\./g,'_'));if(cb&&cb.checked)perms.push(pm.key);});
 try{
  const r=await apiPost('/api/accounts',{username:u,nama,role:pickRole,unit,perms});
  M.accounts=r.accounts||M.accounts;
  closeModal();if(r.cred)showCreds([r.cred],'Akun '+roleLabelFull(pickRole)+' — '+u+' dibuat');paint();
 }catch(err){toast(err.message,true);}}
function hasAccount(empId){return loadAccts().some(a=>a.empId===empId);}
function acctOf(empId){return loadAccts().find(a=>a.empId===empId);}
function acctSection(e){const ac=acctOf(e.id);
 const kv=(l,v)=>'<div class="k"><div class="l">'+l+'</div><div class="v">'+(v?esc(v):'<span style="color:var(--ink-3);font-weight:400">—</span>')+'</div></div>';
 const pwBtn=ac?'<button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="resetPw(\''+esc(ac.u)+'\')">Reset &amp; Lihat Sandi Baru</button>':'<button class="btn" style="padding:4px 9px;font-size:11px" onclick="closeModal();createAcctFor(\''+e.id+'\')">Buat Akun</button>';
 const copyRow=ac?'<div class="k" style="grid-column:1/-1"><div class="l">Salin Kredensial</div><div class="v"><button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="copyOneAcct(\''+esc(ac.u)+'\')">Salin detail akun</button></div></div>':'';
 return '<div class="modal-sec">Akun Login (khusus Admin)</div><div class="kv">'+
   kv('Username / NIP',ac?ac.u:'')+kv('Status Akun',ac?('Aktif · '+roleLabelFull(ac.role)):'Belum dibuat')+
   '<div class="k" style="grid-column:1/-1"><div class="l">Kata Sandi</div><div class="v" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-family:monospace;color:var(--ink-3)">••••••••••</span> <span style="font-size:11px;color:var(--ink-3)">(hash — tak bisa ditampilkan)</span>'+pwBtn+'</div></div>'+
   copyRow+'</div>';}
async function genOneNIP(empId){const e=DATA.find(x=>x.id==empId);if(!e)return;if(e.nip){toast('Sudah punya NIP: '+e.nip);return;}
 try{const upd=await apiPost('/api/employees/'+empId+'/nip',{});const i=DATA.findIndex(x=>x.id==empId);if(i>=0)DATA[i]=upd;toast('✓ NIP: '+upd.nip);paint();}catch(err){toast(err.message,true);}}
/* buat akun untuk 1 karyawan (server: NIP + password random unik) */
async function createAcctFor(empId){
 try{
  const r=await apiPost('/api/accounts',{empId});
  M.accounts=r.accounts||M.accounts;
  if(r.cred){
    const e=DATA.find(x=>x.id==empId);if(e&&r.cred.nip){e.nip=r.cred.nip;}
    showCreds([r.cred],'Akun untuk '+r.cred.nama.split(',')[0]+' dibuat');
  }
  toast('Akun dibuat');paint();
 }catch(err){toast(err.message,true);}}
async function generateBulk(){const only=document.getElementById('ac_bulkunit').value;
 try{
  const r=await apiPost('/api/accounts/bulk',{unit:only||''});
  M.accounts=r.accounts||M.accounts;
  await refreshEmpData();
  toast('✓ '+r.count+' akun dibuat — password unik per orang');paint();
  if(r.creds&&r.creds.length)showCreds(r.creds.slice(0,300),r.count+' akun dibuat (password acak unik). Salin/ekspor daftar sekarang — password tidak ditampilkan lagi.');
 }catch(err){toast(err.message,true);}}
/* generate NIP saja (server, per karyawan) */
async function generateNIPall(){const only=document.getElementById('ac_bulkunit')?document.getElementById('ac_bulkunit').value:'';let n=0;
 const list=DATA.filter(e=>(!only||e.unit===only)&&!e.nip).sort((a,b)=>{const ua=unitCode(a.unit),ub=unitCode(b.unit);if(ua!==ub)return ua.localeCompare(ub);const ya=+a.thnAktif||9999,yb=+b.thnAktif||9999;if(ya!==yb)return ya-yb;return (''+a.id).localeCompare(''+b.id,undefined,{numeric:true});});
 for(const e of list){try{const upd=await apiPost('/api/employees/'+e.id+'/nip',{});const i=DATA.findIndex(x=>x.id==e.id);if(i>=0)DATA[i]=upd;n++;}catch(_){}}
 toast('✓ '+n+' NIP di-generate');paint();}
let lastCreds=null;
function showCreds(creds,title){
 const rows=creds.map(c=>`<tr><td>${esc(c.nama.split(',')[0])}</td>${c.nip!==undefined?`<td><code>${esc(c.nip||'—')}</code></td>`:''}<td><code>${esc(c.u)}</code></td><td><code style="color:var(--brand);font-weight:700">${esc(c.pw)}</code></td></tr>`).join('');
 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:640px">
   <div class="modal-h"><div><div class="nm">Kredensial Akun</div><div class="rl">${esc(title)}</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div style="padding:12px 18px">
     <div class="login-err" style="background:var(--warn-bg);color:var(--warn)">⚠ Simpan/bagikan sekarang. Demi keamanan, password acak <b>tidak disimpan sebagai teks</b> & tidak dapat dilihat lagi.</div>
     <div class="tbl-wrap" style="border:0;max-height:50vh;overflow:auto"><table class="acct-tbl"><thead><tr><th>Nama</th>${creds[0]&&creds[0].nip!==undefined?'<th>NIP</th>':''}<th>Username</th><th>Password</th></tr></thead><tbody>${rows}</tbody></table></div>
     <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" onclick='copyCreds()'>Salin Semua (CSV)</button><button class="btn ghost" onclick="closeModal()">Tutup</button></div>
   </div></div></div>`;
 window._creds=creds;const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';}
function copyCreds(){const c=window._creds||[];const csv='nama,nip,username,password\n'+c.map(x=>['"'+x.nama+'"',x.nip||'',x.u,x.pw].join(',')).join('\n');
 navigator.clipboard&&navigator.clipboard.writeText(csv).then(()=>toast('✓ Kredensial disalin (CSV)')).catch(()=>toast('Gagal menyalin',true));}
async function resetPw(u){
 try{const r=await apiPost('/api/accounts/'+encodeURIComponent(u)+'/reset',{});M.accounts=r.accounts||M.accounts;if(r.cred)showCreds([r.cred],'Password direset');paint();}
 catch(err){toast(err.message,true);}}
async function delAcct(u){
 try{const r=await apiDelete('/api/accounts/'+encodeURIComponent(u));M.accounts=r.accounts||M.accounts.filter(a=>a.u!==u);toast('Akun '+u+' dihapus');paint();}
 catch(err){toast(err.message,true);}}
function exportAccts(){const accs=loadAccts();const csv='nip,username,nama,peran,unit\n'+accs.map(a=>[a.nip||'',a.u,'"'+(a.nama||'')+'"',a.role,a.unit||''].join(',')).join('\n');
 navigator.clipboard&&navigator.clipboard.writeText(csv).then(()=>toast('✓ Daftar akun disalin (CSV) — tanpa password')).catch(()=>toast('Salin manual dari console',true));}
function copyText(t){if(!t)return;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('✓ Disalin: '+t)).catch(()=>toast('Gagal menyalin',true));}
function copyOneAcct(u){if(!can('accounts')){toast('Hanya admin pusat yang dapat menyalin',true);return;}const a=loadAccts().find(x=>x.u===u);if(!a)return;const txt='Nama: '+(a.nama||'')+'\nUsername/NIP: '+a.u+'\nPeran: '+roleLabelFull(a.role)+'\nUnit: '+(a.unit||'');navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast('✓ Detail akun disalin')).catch(()=>toast('Gagal menyalin',true));}

/* gated boot — sesi divalidasi server via /api/me */
(async function(){
 try{
  const me=await apiGet('/api/me');
  SESSION={u:me.user.username,role:me.user.role,nama:me.user.nama,unit:me.user.unit,empId:me.user.empId,nip:me.user.nip,mustChange:!!me.user.mustChange};
  SESSION.perms=me.user.perms||null;
  try{sessionStorage.setItem(SESS_KEY,JSON.stringify(SESSION))}catch(e){}
  if(SESSION.mustChange){state.view='profile';bootApp();showMustChange();}
  else bootApp();
 }catch(e){
  SESSION=null;
  try{sessionStorage.removeItem(SESS_KEY)}catch(x){}
  renderLogin();
 }
})();
function showMustChange(){try{document.getElementById('pf_old').closest('.card.panel')?.scrollIntoView();}catch(e){}toast('⚠ Wajib ganti kata sandi sekarang',true);}
</script>
