function renderLogin(err){
 document.querySelector('.app').style.display='none';
 document.getElementById('topbar')&&(document.getElementById('topbar').style.display='none');
 let root=document.getElementById('loginRoot');if(!root){root=document.createElement('div');root.id='loginRoot';document.body.appendChild(root);}
 root.innerHTML=`<div class="login-wrap"><div class="login-card">
   <div class="login-head"><img src="logo.png" alt="AL-WILDAN" onerror="this.style.display='none'"><div class="t">SDM AL-WILDAN</div><div class="s">Portal HRIS · Holding & Karyawan</div></div>
   <form class="login-body" onsubmit="doLogin(event);return false">
     ${err?`<div class="login-err">⚠ ${esc(err)}</div>`:''}
     <div class="field"><label>Username / Email</label><input id="lg_u" autocomplete="username" placeholder="username atau email" required></div>
     <div class="field"><label>Kata Sandi</label><div class="pw-wrap"><input id="lg_p" type="password" autocomplete="current-password" placeholder="••••••••" required><button type="button" onclick="const p=document.getElementById('lg_p');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Lihat':'Tutup'">Lihat</button></div></div>
     <button class="btn" type="submit">${ic('lock')} Masuk</button>
     <div class="login-demo"><b>Akun demo:</b><br>Admin Holding → <code onclick="fillLogin('admin','alwildan2026')">admin / alwildan2026</code><br>Karyawan → username = <b>NIP</b> (dibuat di panel Akun), sandi awal <code>aw2026</code>. Buat akun massal dulu di menu Manajemen Akun untuk mendapatkan NIP tiap karyawan.</div>
   </form></div></div>`;
}
function fillLogin(u,p){document.getElementById('lg_u').value=u;document.getElementById('lg_p').value=p;}
function lockInfo(){try{return JSON.parse(sessionStorage.getItem('sdm-lock'))||{n:0,until:0}}catch(e){return{n:0,until:0}}}
function setLock(o){try{sessionStorage.setItem('sdm-lock',JSON.stringify(o))}catch(e){}}
async function doLogin(ev){ev.preventDefault();const lk=lockInfo();
 if(lk.until>Date.now()){renderLogin('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((lk.until-Date.now())/1000)+' detik.');return false;}
 const u=document.getElementById('lg_u').value.trim().toLowerCase();const p=document.getElementById('lg_p').value;
 const accs=loadAccts();let acc=accs.find(a=>a.u===u);
 // fallback: match employee by NIP (username) or email with default password if account not yet generated
 if(!acc){const emp=DATA.find(e=>(e.nip&&e.nip.toLowerCase()===u)||slugUser(e)===u);if(emp&&p==='aw2026'){acc={u,ph:await sha256('aw2026'),role:'karyawan',nama:emp.nama,unit:emp.unit,empId:emp.id,nip:emp.nip};}}
 const ph=await sha256(p);
 const legacyPh='x'+btoa(unescape(encodeURIComponent(p))); // hash format lama (versi rusak) — diterima demi kompatibilitas
 if(acc&&(acc.ph===ph||acc.ph===legacyPh)){
   // self-heal: jika akun masih pakai hash lama, mutakhirkan ke SHA-256 asli
   if(acc.ph===legacyPh){try{const all=loadAccts();const sa=all.find(x=>x.u===acc.u);if(sa){sa.ph=ph;saveAccts(all);}}catch(e){}}
   setLock({n:0,until:0});SESSION={u:acc.u,role:acc.role,nama:acc.nama,unit:acc.unit,empId:acc.empId};try{sessionStorage.setItem(SESS_KEY,JSON.stringify(SESSION))}catch(e){}bootApp();return false;}
 const n=(lk.n||0)+1;setLock({n,until:n>=5?Date.now()+60000:0});
 renderLogin(n>=5?'Akun terkunci sementara 60 detik karena 5 kali gagal.':'Username atau kata sandi salah. ('+n+'/5)');return false;}
function logout(){SESSION=null;try{sessionStorage.removeItem(SESS_KEY)}catch(e){}location.hash='';const lr=document.getElementById('loginRoot');renderLogin();}

function bootApp(){const lr=document.getElementById('loginRoot');if(lr)lr.remove();
 document.querySelector('.app').style.display='';document.getElementById('topbar')&&(document.getElementById('topbar').style.display='');
 // role-based nav & default view
 state.view=firstAllowedView();
 buildNav();paint();
 setInterval(()=>{if(state.view==='chat'&&typeof chatPull==='function')chatPull();},5000);}

function pwToggle(id,btn){const p=document.getElementById(id);p.type=p.type==='password'?'text':'password';btn.textContent=p.type==='password'?'Lihat':'Tutup';}
function pwStrength(pw){let s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;return s;}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='pf_new'){const m=document.getElementById('pf_meter');if(m){const s=pwStrength(e.target.value);m.textContent='Kekuatan: '+['—','Sangat lemah','Lemah','Sedang','Kuat','Sangat kuat'][s];m.style.color=s>=4?'var(--pos)':s>=3?'var(--warn)':'var(--neg)';}}});
function genMyPw(){const pw=randPassword(12);document.getElementById('pf_new').value=pw;document.getElementById('pf_conf').value=pw;const m=document.getElementById('pf_meter');if(m){m.textContent='Kekuatan: Sangat kuat (disarankan)';m.style.color='var(--pos)';}toast('Sandi kuat dibuat — jangan lupa simpan');}
async function changeMyPw(){const old=document.getElementById('pf_old').value,nw=document.getElementById('pf_new').value,cf=document.getElementById('pf_conf').value;

 const accs=loadAccts();const a=accs.find(x=>x.u===SESSION.u);if(!a){toast('Akun tidak ditemukan',true);return;}

 a.ph=await sha256(nw);a.mustChange=false;saveAccts(accs);document.getElementById('pf_old').value='';document.getElementById('pf_new').value='';document.getElementById('pf_conf').value='';toast('✓ Kata sandi berhasil diubah');}

/* per-employee check-in (localStorage, per day) */
function meKey(id){return 'sdm-ck-'+id+'-'+new Date().toISOString().slice(0,10);}
function meCheck(id){try{return JSON.parse(localStorage.getItem(meKey(id)))||{}}catch(e){return{}}}

 pushReq({id:'REQ'+Date.now(),kind:'ajuan',empId:id,nama:e.nama,unit:e.unit,judul:jenis,mulai:g('aj_mulai'),selesai:g('aj_selesai'),alasan:g('aj_alasan'),tgl:new Date().toISOString().slice(0,10),status:'Menunggu'});
 pushActivity({ts:Date.now(),tgl:new Date().toISOString().slice(0,10),aksi:'Pengajuan '+jenis,type:'ajuan',col:'var(--warn)',nama:e.nama,id,unit:e.unit,ket:g('aj_alasan')||jenis,by:e.nama});
 toast('✓ Pengajuan terkirim ke HR Pusat');paint();}
function tkCatChange(){const cat=document.getElementById('tk_cat').value;const box=document.getElementById('strataBox');if(box)box.hidden=!/strata/i.test(cat);}
function checkIjazah(inp){const st=document.getElementById('tk_ijazah_status');const f=inp.files[0];if(!f){if(st)st.textContent='';return;}
 if(f.type!=='application/pdf'){if(st){st.textContent='Harus PDF';st.style.color='var(--neg)';}inp.value='';return;}
 if(f.size>1024*1024){if(st){st.textContent='Ukuran '+(f.size/1024/1024).toFixed(2)+'MB melebihi 1MB';st.style.color='var(--neg)';}inp.value='';return;}
 if(st){st.textContent='✓ '+f.name+' ('+(f.size/1024).toFixed(0)+' KB)';st.style.color='var(--pos)';}}

 if(/strata/i.test(cat)){const ij=document.getElementById('tk_ijazah');if(!ij||!ij.files[0]){toast('Lampirkan file ijazah PDF (maks 1MB)',true);return;}

 pushReq({id:'TKT'+Date.now(),kind:'tiket',empId:id,nama:e.nama,unit:e.unit,judul,cat,prio:g('tk_prio'),desc,strata:/strata/i.test(cat)?g('tk_strata'):'',lampiran:/strata/i.test(cat)&&document.getElementById('tk_ijazah').files[0]?document.getElementById('tk_ijazah').files[0].name:'',tgl:new Date().toISOString().slice(0,10),waktu:new Date().toLocaleString('id-ID'),status:'Baru'});
 if(/strata/i.test(cat))toast('✓ Tiket penyesuaian strata terkirim — HR akan verifikasi ijazah via email');else
 toast('✓ Tiket terkirim ke pusat');paint();}
function submitProfilChange(id){const e=DATA.find(x=>x.id==id);const g=k=>{const el=document.getElementById('pm_'+k);return el?el.value.trim():undefined;};
 const fields=['nikKtp','email','noHp','alamat','tmpLahir','namaBank','rekBSI'];const changes={};let n=0;
 fields.forEach(k=>{const v=g(k);if(v!==undefined&&v!==(e[k]||'')){changes[k]={dari:e[k]||'—',ke:v};n++;}});
 if(!n){toast('Tidak ada perubahan',true);return;}
 pushReq({id:'PRF'+Date.now(),kind:'profil',empId:id,nama:e.nama,unit:e.unit,judul:'Perubahan Profil ('+n+' field)',changes,tgl:new Date().toISOString().slice(0,10),waktu:new Date().toLocaleString('id-ID'),status:'Menunggu'});
 pushActivity({ts:Date.now(),tgl:new Date().toISOString().slice(0,10),aksi:'Pengajuan Ubah Profil',type:'profil',col:'var(--warn)',nama:e.nama,id,unit:e.unit,ket:n+' field diajukan',by:e.nama});
 toast('✓ Perubahan diajukan — menunggu persetujuan HR Pusat');paint();}
function approveProfil(rid){const arr=loadReq();const r=arr.find(x=>x.id===rid);if(!r)return;const e=DATA.find(x=>x.id==r.empId);

 r.status='Disetujui';saveReq(arr);
 pushActivity({ts:Date.now(),tgl:new Date().toISOString().slice(0,10),aksi:'Perubahan Profil Disetujui',type:'profil',col:'var(--pos)',nama:r.nama,id:r.empId,unit:r.unit,ket:'Database diperbarui',by:(SESSION&&SESSION.nama)||'HR'});
 toast('✓ Perubahan disetujui — database diperbarui');paint();}

   </div></div></div>`;const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';}
function decideReq(rid,dec){const arr=loadReq();const r=arr.find(x=>x.id===rid);if(!r)return;r.status=dec;saveReq(arr);
 // resign disetujui -> update status kerja
 if(r.kind==='ajuan'&&dec==='Disetujui'&&/resign/i.test(r.judul)){const e=DATA.find(x=>x.id==r.empId);if(e){e.statusKerja='Resign';e._local=true;e.riwayat=e.riwayat||[];e.riwayat.unshift({aksi:'Resign (via pengajuan)',tgl:new Date().toISOString().slice(0,10),ket:r.alasan||''});saveLocal(e);pushActivity({ts:Date.now(),tgl:new Date().toISOString().slice(0,10),aksi:'Resign disetujui',type:'resign',col:'var(--ink-3)',nama:e.nama,id:e.id,unit:e.unit,ket:r.alasan||'',by:(SESSION&&SESSION.nama)||'HR'});}}
 toast('Pengajuan '+dec.toLowerCase());paint();}

 clearTimeout(_recSearchT);_recSearchT=setTimeout(()=>{const q=(state.recQ||'').toLowerCase();const fstat=state.recStat||'';
   const rows=recMerged().filter(c=>(!q||(c.nama+' '+c.unit+' '+c.mapel+' '+(c.s1||'')).toLowerCase().includes(q))&&(!fstat||recStage(c)===fstat));
   tb.innerHTML=recRows(rows,can('recruitment.edit'),can('recruitment.approve'));if(cnt)cnt.textContent=rows.length+' hasil';},160);}
function recruitHistory(list){const tot=list.length;const aktif=list.filter(c=>recStage(c)==='Aktif').length;const batal=list.filter(c=>recStage(c)==='Batal').length;const proses=tot-aktif-batal;
 const konv=tot?Math.round(aktif/tot*100):0;const iv=list.filter(c=>c.interview);const ivLanjut=iv.filter(c=>c.interview==='Lanjut').length;
 // ketercapaian per cabang (aktif/total)
 const byU={};list.forEach(c=>{const u=c.unit||'—';byU[u]=byU[u]||{tot:0,akt:0};byU[u].tot++;if(recStage(c)==='Aktif')byU[u].akt++;});
 const uRows=Object.entries(byU).sort((a,b)=>b[1].tot-a[1].tot).slice(0,10).map(([u,v])=>{const pr=v.tot?Math.round(v.akt/v.tot*100):0;return `<div class="bar-row"><span class="nm">${esc(u)}</span><div class="bar-track"><div class="bar-fill" style="width:${pr}%;background:${pr>=60?'var(--pos)':pr>=30?'var(--warn)':'var(--neg)'}"></div></div><span class="vv tnum">${v.akt}/${v.tot}</span></div>`;}).join('');
 const log=loadRecLog().slice(0,12);
 const logRows=log.map(l=>`<tr><td style="white-space:nowrap">${esc(l.tgl)}</td><td><b>${esc((l.nama||'').split(',')[0])}</b> <span style="color:var(--ink-3);font-size:11px">${esc(l.unit||'')}</span></td><td>${esc(l.aksi)}${l.note?`<div style="font-size:11px;color:var(--ink-3)">${esc(l.note)}</div>`:''}</td><td style="color:var(--ink-3);font-size:11px">${esc(l.by||'')}</td></tr>`).join('');
 return `<div class="rec-hist-box">
 <div class="sec-h" style="margin-top:0"><h2 style="color:var(--rh-ink)">📊 History & Ketercapaian Rekrutmen</h2><span class="hint">progres & konversi terukur</span></div>
 <div class="grid tiles" style="margin-bottom:14px">
   ${tile('Konversi Aktif',konv+'%',{color:konv>=50?'var(--pos)':konv>=25?'var(--warn)':'var(--neg)',meta:aktif+' dari '+tot+' kandidat'})}
   ${tile('Sedang Diproses',fmtID.format(proses),{color:'var(--warn)',meta:'belum final'})}
   ${tile('Sudah Interview',fmtID.format(iv.length),{color:'var(--c1)',meta:ivLanjut+' lanjut'})}
   ${tile('Batal / Gugur',fmtID.format(batal),{color:'var(--neg)'})}
 </div>
 <div class="two-col">
   <div class="card panel"><div class="panel-h"><h3>Ketercapaian per Cabang</h3><span class="hint">aktif / total</span></div>${uRows||'<div class="empty">Belum ada data.</div>'}</div>
   <div class="card panel"><div class="panel-h"><h3>Log Aktivitas Rekrutmen</h3><span class="hint">jejak proses</span></div><div class="tbl-wrap" style="border:0;max-height:300px;overflow:auto"><table><thead><tr><th>Tgl</th><th>Kandidat</th><th>Aksi</th><th>Oleh</th></tr></thead><tbody>${logRows||'<tr><td colspan=4><div class="empty">Belum ada aktivitas tercatat. Lakukan set gaji / interview / aktivasi untuk mulai melacak.</div></td></tr>'}</tbody></table></div></div>
 </div></div>`;}
function recStage(c){if(c.aktivasi==='approved'||/aktif/i.test(c.konfirmasi))return 'Aktif';if(/batal/i.test(c.status))return 'Batal';if(c.aktivasi==='diajukan')return 'Diajukan';if(c.thpSet||c.thpBersih)return 'Set Gaji';if(/lulus|aksel|magang/i.test(c.pantuhir))return 'Pantuhir';return 'Kandidat';}
function recActions(c,canEdit,canApprove){const stg=recStage(c);let b='';
 if(canEdit&&stg!=='Aktif'&&stg!=='Batal'){b+=`<button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="setGaji('${c.id}')">Set Gaji</button> `;}
 if(canEdit&&(stg==='Set Gaji'||stg==='Pantuhir')&&stg!=='Diajukan'){b+=`<button class="btn ghost" style="padding:4px 9px;font-size:11px" onclick="ajukanAktivasi('${c.id}')">Ajukan Aktivasi</button> `;}
 if(canApprove&&stg==='Diajukan'){b+=`<button class="btn" style="padding:4px 9px;font-size:11px" onclick="approveAktivasi('${c.id}')">Setujui Aktivasi</button> `;}
 if(!b)b='<span style="color:var(--ink-3);font-size:11px">lihat</span>';return b;}
function openCand(id){const c=recMerged().find(x=>x.id===id);if(!c)return;const kv=(l,v)=>`<div class="k"><div class="l">${l}</div><div class="v">${v?esc(v):'<span style=\"color:var(--ink-3);font-weight:400\">—</span>'}</div></div>`;
 const track=recTrack(c);const canIntv=can('recruitment.interview');
 const intvColor={Lanjut:'var(--pos)',Hold:'var(--warn)',Batal:'var(--neg)'}[c.interview]||'var(--ink-3)';
 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:600px"><div class="modal-h"><div class="avatar">${initials(c.nama)}</div><div><div class="nm">${esc(c.nama)}</div><div class="rl">Kandidat · ${esc(c.unit||'')} · ${recStage(c)}${c.interview?' · Interview: '+c.interview:''}</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div class="modal-sec">Tracking Proses Rekrutmen</div>
   <div style="padding:12px 18px"><div class="jtl">${track.map(t=>`<div class="jtl-item"><div class="jtl-yr" style="width:auto;color:${t.ok?'var(--pos)':'var(--ink-3)'};font-size:14px;text-align:center">${t.ok?'✓':'○'}</div><div class="jtl-body"><div class="jtl-jab">${esc(t.tahap)}</div><div class="jtl-sub">${esc(t.info)}${t.link?` · <a href="${esc(t.link)}" target="_blank" rel="noopener">Buka Berita Acara ↗</a>`:''}</div></div></div>`).join('')}</div></div>
   <div class="modal-sec">Hasil Pantukhir / Tes Cabang</div><div style="padding:12px 18px">
     <div class="kv" style="margin:-12px -18px 0">${kv('Hasil Pantuhir',c.pantuhir)}${kv('Catatan Pantuhir',c.pantuhirNote)}<div class="k" style="grid-column:1/-1"><div class="l">Berita Acara</div><div class="v">${c.beritaAcara?`<a href="${esc(c.beritaAcara)}" target="_blank" rel="noopener">Buka Berita Acara ↗</a>`:'<span style="color:var(--ink-3);font-weight:400">Belum ada</span>'}</div></div></div>
     ${(can('recruitment.edit'))?`<button class="btn ghost" style="margin-top:12px;padding:6px 12px;font-size:12px" onclick="editPantuhir('${c.id}')">✎ Edit Pantuhir & Berita Acara</button>`:''}
   </div>
   <div class="modal-sec">Data Kandidat & Estimasi</div><div class="kv">${kv('Email',c.email)}${kv('No. WA',(c.wa||'').replace('https://wa.me/','') )}${kv('Status',c.status)}${kv('S1',c.s1)}${kv('Mapel/Subjek',c.mapel)}
     <div class="k"><div class="l">Estimasi Selesai Proses</div><div class="v">${c.estimasi?esc(c.estimasi):'<span style="color:var(--warn);font-weight:600">belum diedit</span>'}</div></div>
     <div class="k"><div class="l">Estimasi Tanggal Aktif</div><div class="v">${c.estimasiAktif?esc(c.estimasiAktif):'<span style="color:var(--warn);font-weight:600">belum diedit</span>'}</div></div>
     <div class="k"><div class="l">Catatan Estimasi</div><div class="v">${c.estimasiNote?esc(c.estimasiNote):'<span style="color:var(--ink-3);font-weight:400">—</span>'}</div></div></div>
     ${(can('recruitment.edit'))?`<div style="padding:10px 18px 0"><button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="editEstimasi('${c.id}')">✎ Edit Estimasi & Catatan</button></div>`:''}
   <div class="modal-sec">Set Gaji</div><div class="kv">${kv('Pengajuan',c.pengajuan?rp(c.pengajuan):'')}${kv('THP Set',(c.thpSet||c.thpBersih)?rp(c.thpSet||c.thpBersih):'')}${kv('Rekomendasi Nego',c.nego)}${kv('Konfirmasi',c.konfirmasi)}</div>
   <div class="modal-sec">Interview Akhir (Tim HR)</div>
   <div style="padding:12px 18px">
     <div style="margin-bottom:10px">Hasil saat ini: <span class="pill" style="background:color-mix(in srgb,${intvColor} 15%,transparent);color:${intvColor}"><span class="d" style="background:currentColor"></span>${esc(c.interview||'Belum diputuskan')}</span></div>
     ${canIntv?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" style="background:var(--pos);border-color:var(--pos);padding:7px 14px;font-size:12px" onclick="setInterview('${c.id}','Lanjut')">✓ Lanjut</button><button class="btn" style="background:var(--warn);border-color:var(--warn);padding:7px 14px;font-size:12px" onclick="setInterview('${c.id}','Hold')">⏸ Hold (Negosiasi)</button><button class="btn" style="background:var(--neg);border-color:var(--neg);padding:7px 14px;font-size:12px" onclick="setInterview('${c.id}','Batal')">✕ Batal</button></div>`:'<p style="font-size:12px;color:var(--ink-3)">Anda tidak punya izin update interview.</p>'}
     <div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin:4px 0 6px">Riwayat Catatan Interview</div>
     ${(()=>{const log=c.interviewLog&&c.interviewLog.length?c.interviewLog:[];const extra=canIntv?`<tr><td colspan="4" style="padding:8px"><button class="btn ghost" style="padding:5px 11px;font-size:11px" onclick="addInterviewNote('${c.id}')">+ Tambah Catatan Interview</button></td></tr>`:'';
       return `<div class="tbl-wrap" style="border:1px solid var(--line)"><table><thead><tr><th>Tanggal</th><th>Hasil</th><th>Catatan</th><th>Oleh</th></tr></thead><tbody>${log.length?log.map(r=>`<tr><td style="white-space:nowrap">${esc(r.tgl)}</td><td><span class="pill ${({Lanjut:'pos',Hold:'warn',Batal:'neg'})[r.hasil]||'grey'}"><span class="d" style="background:currentColor"></span>${esc(r.hasil)}</span></td><td>${esc(r.note||'—')}</td><td style="font-size:11px;color:var(--ink-3)">${esc(r.by||'')}</td></tr>`).join(''):`<tr><td colspan="4"><div class="empty" style="padding:16px;font-size:12px">Belum ada catatan interview. ${canIntv?'Tambahkan catatan setiap sesi interview.':''}</div></td></tr>`}${extra}</tbody></table></div>`;})()}
   </div>
   <div style="padding:0 18px 14px"><div class="doc-links">${c.cv?`<a href="${esc(c.cv)}" target="_blank" rel="noopener">${ic('ext')} CV</a>`:''}${c.kesehatan?`<a href="${esc(c.kesehatan)}" target="_blank" rel="noopener">${ic('heart')} Kesehatan</a>`:''}${c.beritaAcara?`<a href="${esc(c.beritaAcara)}" target="_blank" rel="noopener">${ic('ext')} Berita Acara</a>`:''}</div></div></div></div>`;
 const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';}
function setInterview(id,val){const c=recMerged().find(x=>x.id===id);if(!c)return;const col={Lanjut:'var(--pos)',Hold:'var(--warn)',Batal:'var(--neg)'}[val];
 const ph={Lanjut:'Catatan hasil interview (mis. mulai kerja, catatan onboarding)…',Hold:'Catatan negosiasi (mis. nego gaji, tunggu keputusan)…',Batal:'Alasan pembatalan…'}[val];
 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:460px"><div class="modal-h"><div class="avatar" style="background:color-mix(in srgb,${col} 15%,transparent);color:${col}">${val==='Lanjut'?'✓':val==='Hold'?'⏸':'✕'}</div><div><div class="nm">Interview: ${val}${val==='Hold'?' (Negosiasi)':''}</div><div class="rl">${esc(c.nama)} · ${esc(c.unit||'')}</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div style="padding:16px 18px"><div class="field"><label>Catatan / Remarks Hasil Interview ${val==='Lanjut'?'(opsional)':'(wajib)'}</label><textarea id="iv_note" rows="4" placeholder="${ph}">${esc(c.interviewNote||'')}</textarea></div>
   <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" style="background:${col};border-color:${col}" onclick="saveInterview('${id}','${val}')">Simpan Keputusan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div></div></div></div>`;
 const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';setTimeout(()=>{const t=document.getElementById('iv_note');if(t)t.focus();},50);}
function saveInterview(id,val){const note=(document.getElementById('iv_note')||{}).value||'';if((val==='Hold'||val==='Batal')&&!note.trim()){toast('Catatan wajib diisi untuk '+val,true);return;}
 const cur=recMerged().find(x=>x.id===id);const log=(cur.interviewLog||[]).slice();log.unshift({tgl:new Date().toISOString().slice(0,10),hasil:val,note:note.trim(),by:(SESSION&&SESSION.nama)||'HR'});
 recSet(id,{interview:val,interviewNote:note.trim(),interviewTgl:new Date().toISOString().slice(0,10),interviewBy:(SESSION&&SESSION.nama)||'HR',interviewLog:log});
 const c=recMerged().find(x=>x.id===id);
 pushActivity({ts:Date.now(),tgl:new Date().toISOString().slice(0,10),aksi:'Interview Akhir: '+val,type:'rekrut',col:{Lanjut:'var(--pos)',Hold:'var(--warn)',Batal:'var(--neg)'}[val],nama:c.nama,id:'',unit:c.unit,ket:note.trim()||('Hasil interview '+val),by:(SESSION&&SESSION.nama)||'HR'});
 recLog(id,'Interview Akhir: '+val,note.trim());
 toast('✓ Interview '+val+' tersimpan');closeModal();openCand(id);}

 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:460px"><div class="modal-h"><div class="avatar">${initials(c.nama)}</div><div><div class="nm">Tambah Catatan Interview</div><div class="rl">${esc(c.nama)} · ${esc(c.unit||'')}</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div style="padding:16px 18px">
     <div class="field"><label>Hasil Sesi Ini</label><select id="in_hasil"><option value="Proses">Proses / Catatan</option><option value="Lanjut">Lanjut</option><option value="Hold">Hold (Negosiasi)</option><option value="Batal">Batal</option></select></div>
     <div class="field" style="margin-top:10px"><label>Tanggal</label><input id="in_tgl" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
     <div class="field" style="margin-top:10px"><label>Catatan Interview</label><textarea id="in_note" rows="4" placeholder="Tuliskan hasil / catatan sesi interview…"></textarea></div>
     <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" onclick="saveInterviewNote('${id}')">Simpan Catatan</button><button class="btn ghost" onclick="closeModal();openCand('${id}')">Batal</button></div>
   </div></div></div>`;
 document.getElementById('modalRoot').remove();const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);}
function saveInterviewNote(id){const g=i=>{const el=document.getElementById(i);return el?el.value:'';};const hasil=g('in_hasil'),note=g('in_note').trim(),tgl=g('in_tgl');if(!note){toast('Catatan wajib diisi',true);return;}
 const cur=recMerged().find(x=>x.id===id);const log=(cur.interviewLog||[]).slice();log.unshift({tgl,hasil,note,by:(SESSION&&SESSION.nama)||'HR'});
 const patch={interviewLog:log};if(hasil!=='Proses'){patch.interview=hasil;patch.interviewNote=note;patch.interviewTgl=tgl;patch.interviewBy=(SESSION&&SESSION.nama)||'HR';}
 recSet(id,patch);recLog(id,'Catatan Interview: '+hasil,note);
 pushActivity({ts:Date.now(),tgl,aksi:'Catatan Interview: '+hasil,type:'rekrut',col:{Lanjut:'var(--pos)',Hold:'var(--warn)',Batal:'var(--neg)',Proses:'var(--c1)'}[hasil],nama:cur.nama,id:'',unit:cur.unit,ket:note,by:(SESSION&&SESSION.nama)||'HR'});
 toast('✓ Catatan interview ditambahkan');closeModal();openCand(id);}

 recLog(id,'Update Pantukhir: '+g('ep_hasil'),g('ep_note'));toast('✓ Pantukhir diperbarui');closeModal();paint();}
function recInProgress(unit){const list=recMerged().filter(c=>c.unit===unit);const prog=list.filter(c=>{const s=recStage(c);return s!=='Aktif'&&s!=='Batal';});
 const stc={Kandidat:'grey',Pantuhir:'info',['Set Gaji']:'warn',Diajukan:'warn'};
 const rows=prog.map(c=>{const st=recStage(c);const iv=c.interview?(' · '+c.interview):'';return `<tr onclick="drillOpenCand('${c.id}')" style="cursor:pointer"><td><div class="emp-cell"><div class="avatar">${initials(c.nama)}</div><div><div class="nm">${esc(c.nama)}</div><div class="sm">${esc(c.mapel||'')}</div></div></div></td><td><span class="pill ${stc[st]||'grey'}"><span class="d" style="background:currentColor"></span>${esc(st)}${esc(iv)}</span></td><td>${esc(c.pantuhir||'—')}</td><td>${c.estimasi?esc(c.estimasi):'<span style="color:var(--ink-3)">—</span>'}</td></tr>`;}).join('');

];
function loadCalEv(){try{return JSON.parse(localStorage.getItem(CAL_KEY))||[]}catch(e){return[]}}
function saveCalEv(a){try{localStorage.setItem(CAL_KEY,JSON.stringify(a))}catch(e){}}
function calEvents(y,mo){/* kumpulkan event utk bulan (y,mo 0-based) */
 let evs=[];
 // 1) kaldik
 KALDIK.forEach(e=>{const dt=new Date(e.d);if(dt.getFullYear()===y&&dt.getMonth()===mo)evs.push({day:dt.getDate(),t:e.t,k:e.k});});
 // 2) rekrutmen: estimasi selesai & tanggal aktif & deadline pengajuan
 recMerged().forEach(c=>{
   const push=(ds,label,k)=>{if(!ds)return;const dt=new Date(ds);if(!isNaN(dt)&&dt.getFullYear()===y&&dt.getMonth()===mo)evs.push({day:dt.getDate(),t:label,k});};
   const nm=(c.nama||'').split(',')[0];
   if(c.aktivasi!=='approved'){push(c.estimasi,'🎯 Est. selesai: '+nm+' ('+(c.unit||'')+')','rekrut');}
   push(c.estimasiAktif,'✅ Aktif: '+nm+' ('+(c.unit||'')+')','aktif');
 });
 // 3) agenda manual (tersimpan lokal, bisa dihapus)
 loadCalEv().forEach(e=>{const dt=new Date(e.d);if(dt.getFullYear()===y&&dt.getMonth()===mo)evs.push({day:dt.getDate(),t:e.t,k:e.k||'agenda',id:e.id});});
 // filter kategori aktif
 if(state.calFilter&&state.calFilter.length)evs=evs.filter(e=>state.calFilter.includes(e.k));
 return evs;}
function renderCalendar(){const now=new Date();const y=state.calY!=null?state.calY:2026;const mo=state.calM!=null?state.calM:6; // default Juli 2026
 const first=new Date(y,mo,1);const startDow=(first.getDay()+6)%7; // Senin=0
 const days=new Date(y,mo+1,0).getDate();
 const evs=calEvents(y,mo);const byDay={};evs.forEach(e=>{(byDay[e.day]=byDay[e.day]||[]).push(e);});
 const monNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
 const kcol={kaldik:'var(--info)',libur:'var(--neg)',ujian:'#7a3b0a',rekrut:'var(--warn)',aktif:'var(--pos)',agenda:'var(--c4)'};
 let cells='';for(let i=0;i<startDow;i++)cells+='<div class="cal-cell out"></div>';
 for(let d=1;d<=days;d++){const list=byDay[d]||[];const today=(y===now.getFullYear()&&mo===now.getMonth()&&d===now.getDate());
   cells+=`<div class="cal-cell${today?' today':''}" onclick="calDay(${y},${mo},${d})" style="cursor:pointer"><div class="cal-d">${d}</div>${list.slice(0,3).map(e=>`<div class="cal-ev" style="background:color-mix(in srgb,${kcol[e.k]||'var(--ink-3)'} 15%,transparent);color:${kcol[e.k]||'var(--ink-2)'};border-left:2px solid ${kcol[e.k]||'var(--ink-3)'}" title="${esc(e.t)}">${esc(e.t.length>22?e.t.slice(0,22)+'…':e.t)}</div>`).join('')}${list.length>3?`<div class="cal-more">+${list.length-3} lagi</div>`:''}</div>`;}
 // agenda mendatang (rekrutmen + manual)
 const upcoming=[];const t0=new Date(now.toDateString());
 recMerged().forEach(c=>{if(c.aktivasi==='approved')return;const nm=(c.nama||'').split(',')[0];[['estimasi','🎯 Estimasi selesai','rekrut'],['estimasiAktif','✅ Tanggal aktif','aktif']].forEach(([f,lb,k])=>{if(c[f]){const dt=new Date(c[f]);if(!isNaN(dt)&&dt>=t0)upcoming.push({dt,t:lb+': '+nm,sub:(c.unit||'')+' · '+(c.mapel||''),k});}});});
 loadCalEv().forEach(e=>{const dt=new Date(e.d);if(!isNaN(dt)&&dt>=t0)upcoming.push({dt,t:e.t,sub:'Agenda manual',k:e.k||'agenda'});});
 upcoming.sort((a,b)=>a.dt-b.dt);

let lastCreds=null;
function showCreds(creds,title){
 const rows=creds.map(c=>`<tr><td>${esc(c.nama.split(',')[0])}</td>${c.nip!==undefined?`<td><code>${esc(c.nip||'—')}</code></td>`:''}<td><code>${esc(c.u)}</code></td><td><code style="color:var(--brand);font-weight:700">${esc(c.pw)}</code></td></tr>`).join('');
 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:640px">
   <div class="modal-h"><div><div class="nm">Kredensial Akun</div><div class="rl">${esc(title)}</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div style="padding:12px 18px">
     <div class="login-err" style="background:var(--warn-bg);color:var(--warn)">⚠ Simpan/bagikan sekarang. Demi keamanan, password acak <b>tidak disimpan sebagai teks</b> & tidak dapat dilihat lagi.</div>
     <div class="tbl-wrap" style="border:0;max-height:50vh;overflow:auto"><table class="acct-tbl"><thead><tr><th>Nama</th>${creds[0]&&creds[0].nip!==undefined?'<th>NIP</th>':''}<th>Username</th><th>Password</th></tr></thead><tbody>${rows}</tbody></table></div>
     <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" onclick='copyCreds()'>Salin Semua (CSV)</button><button class="btn ghost" onclick="closeModal()">Tutup</button></div>
   </div></div></div>`;
 window._creds=creds;const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';}
function copyCreds(){const c=window._creds||[];const csv='nama,nip,username,password\n'+c.map(x=>['"'+x.nama+'"',x.nip||'',x.u,x.pw].join(',')).join('\n');
 navigator.clipboard&&navigator.clipboard.writeText(csv).then(()=>toast('✓ Kredensial disalin (CSV)')).catch(()=>toast('Gagal menyalin',true));}
async function resetPw(u){const accs=loadAccts();const a=accs.find(x=>x.u===u);if(!a)return;const pw=randPassword(12);a.ph=await sha256(pw);a.mustChange=true;saveAccts(accs);showCreds([{nama:a.nama||u,u,pw,nip:a.nip||''}],'Password direset');}
function delAcct(u){let accs=loadAccts();accs=accs.filter(a=>a.u!==u);saveAccts(accs);toast('Akun '+u+' dihapus');paint();}
function exportAccts(){const accs=loadAccts();const csv='nip,username,nama,peran,unit\n'+accs.map(a=>[a.nip||'',a.u,'"'+(a.nama||'')+'"',a.role,a.unit||''].join(',')).join('\n');
 navigator.clipboard&&navigator.clipboard.writeText(csv).then(()=>toast('✓ Daftar akun disalin (CSV) — tanpa password')).catch(()=>toast('Salin manual dari console',true));}
function copyText(t){if(!t)return;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('✓ Disalin: '+t)).catch(()=>toast('Gagal menyalin',true));}
function copyOneAcct(u){if(!can('accounts')){toast('Hanya admin pusat yang dapat menyalin',true);return;}const a=loadAccts().find(x=>x.u===u);if(!a)return;const txt='Nama: '+(a.nama||'')+'\nUsername/NIP: '+a.u+'\nPeran: '+roleLabelFull(a.role)+'\nUnit: '+(a.unit||'');navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast('✓ Detail akun disalin')).catch(()=>toast('Gagal menyalin',true));}

/* gated boot */
(async function(){await ensureSeedAccounts();
 try{const j=sessionStorage.getItem(SESS_KEY);if(j)SESSION=JSON.parse(j);}catch(e){}
 if(SESSION){bootApp();}else{renderLogin();}
})();
</script>
