<meta charset="utf-8">
<title>SDM AL-WILDAN</title>
<meta name="description" content="Sistem monitoring & manajemen HRIS AL-WILDAN ISLAMIC SCHOOL HOLDING">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ===== LIGHT-ONLY (PaceUI-style, terang) ===== */
:root{
  color-scheme:light;
  --bg:#f4f6f8; --bg-2:#eef1f4;
  --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f4f7;
  --line:#e3e8ee; --line-2:#eef2f6;
  --ink:#141a20; --ink-2:#55606c; --ink-3:#8a95a1;
  --brand:#1F4E79; --brand-2:#1F4E79;
  --c1:#2f6cb0; --c2:#c77400; --c3:#149a63; --c4:#7b5fd0; --c5:#c23a5c; --c6:#0d8fb0;
  --pos:#16a34a; --pos-bg:#e7f6ec; --warn:#b45309; --warn-bg:#fbf1e2; --neg:#c00000; --neg-bg:#fbeaea; --info:#1F4E79; --info-bg:#eaf1f8;
  --grid:#e8edf2; --track:#eef2f6;
  --shadow:0 1px 2px rgba(16,32,45,.05),0 6px 18px rgba(16,32,45,.07);
  --radius:12px; --radius-sm:9px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
a{color:var(--brand)}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.scrim{display:none}

/* ===== SIDEBAR ===== */
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.brand .logo img{width:28px;height:28px;object-fit:contain}
.brand .t1{font-weight:800;font-size:14px;letter-spacing:.2px;line-height:1.1}
.brand .t2{font-size:10px;opacity:.6;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);padding:14px 10px 5px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:var(--ink-2);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .12s}
.nav button svg{width:17px;height:17px;flex:none;opacity:.8}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--surface-3);color:var(--ink);font-weight:600}
.nav button.active svg{opacity:1;color:var(--brand)}
.side-foot{margin-top:auto;padding:14px 16px;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--line);line-height:1.6}

.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 20px}
.crumb{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.crumb b{color:var(--ink);font-weight:700}
.topbar .ttl{font-size:16px;font-weight:800;line-height:1.1}
.topbar .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;width:14px;height:14px;color:var(--ink-3)}
.search input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px 8px 30px;font-size:12.5px;width:220px;color:var(--ink);font-family:inherit}
.search input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--ink);background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px}
.burger{display:none}
.content{padding:20px;max-width:1360px;width:100%}

/* ===== PRIMITIVES ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .lbl{font-size:11.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:7px}
.tile .lbl .dot{width:7px;height:7px;border-radius:2px}
.tile .val{font-size:25px;font-weight:800;margin-top:9px;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.tile .val.money{font-size:20px}
.tile .row2{display:flex;align-items:center;gap:8px;margin-top:5px}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px}
.trend svg{width:11px;height:11px}
.trend.up{color:var(--pos);background:var(--pos-bg)}
.trend.down{color:var(--neg);background:var(--neg-bg)}
.trend.flat{color:var(--ink-2);background:var(--surface-2)}
.tile .meta{font-size:11px;color:var(--ink-3)}
.tile.clickable{transition:transform .12s,box-shadow .12s,border-color .12s}
.tile.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,78,121,.14);border-color:var(--brand)}
.tile-go{margin-left:auto;color:var(--ink-3);font-weight:700;transition:transform .12s}
.tile.clickable:hover .tile-go{transform:translateX(3px);color:var(--brand)}
.tile .lbl{display:flex}
/* search dropdown */
.search-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 40px rgba(16,32,45,.16);max-height:340px;overflow:auto;z-index:40}
.search-dd .sdh{padding:7px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700;background:var(--surface-2);position:sticky;top:0}
.search-dd .sdi{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:12.5px}
.search-dd .sdi:hover{background:var(--surface-2)}
.search-dd .sdi .avatar{width:28px;height:28px;font-size:10px}
.search-dd .sdi .nm{font-weight:700}
.search-dd .sdi .sm{font-size:11px;color:var(--ink-3)}
.search{position:relative}
/* notification bell */
.bell{position:relative}
.topbar > .bell:first-of-type,.topbar .search + .bell{}
.topbar .bell{margin-left:8px}
.topbar:not(:has(.search)) .bell{margin-left:auto}
.bell-btn{position:relative}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--neg);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:20px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.bell-dd{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-width:90vw;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 46px rgba(16,32,45,.18);z-index:45;overflow:hidden}
.bell-dd .bh{padding:11px 14px;font-weight:800;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.bell-dd .bh svg{width:15px;height:15px;flex:none}
.bell-i .bi-ic{flex:none}
.bell-dd .bh .c{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:600}
.bell-list{max-height:360px;overflow:auto}
.bell-i{display:flex;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.bell-i:hover{background:var(--surface-2)}
.bell-i .bi-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.bell-i .bi-ic svg{width:15px;height:15px}
.bell-i .bt{font-size:12.5px;font-weight:700;line-height:1.25}
.bell-i .bs{font-size:11px;color:var(--ink-3);margin-top:2px}
.bell-empty{padding:24px;text-align:center;color:var(--ink-3);font-size:12.5px}

.sec-h{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
.sec-h h2{font-size:14px}
.sec-h .hint{font-size:11.5px;color:var(--ink-3);margin-left:auto}

.panel{padding:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-h h3{font-size:13.5px}
.panel-h h3 svg{width:15px;height:15px;vertical-align:-3px;margin-right:2px}
.modal-sec svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
/* any inline icon inside prose/notes must stay small */
.card p svg, .card div svg.inl, p svg{width:14px;height:14px;vertical-align:-2px}
.note-inline svg{width:15px;height:15px;vertical-align:-3px;flex:none}
.panel-h .hint{font-size:11px;color:var(--ink-3);margin-left:auto}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:12px}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}
.legend-inline i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:10px;font-size:12px}
.bar-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:var(--track);border-radius:5px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;min-width:3px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.bar-row .vv{text-align:right;color:var(--ink);font-weight:700}

/* ring meter grid */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.meter{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.meter .ml{font-size:11.5px;color:var(--ink-2);font-weight:600}
.meter .mn{font-size:10.5px;color:var(--ink-3)}

/* donut legend */
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .li .n{color:var(--ink-2)}
.legend .li .v{margin-left:auto;font-weight:700;color:var(--ink)}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 13px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th .ar{opacity:.4;font-size:9px;margin-left:3px}
tbody td{padding:10px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.emp-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.avatar{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--surface-3);flex:none;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:11px;border:1px solid var(--line)}
.emp-cell .nm{font-weight:700;line-height:1.2;color:var(--ink)}
.emp-cell .sm{font-size:11px;color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.pos{background:var(--pos-bg);color:var(--pos)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neg{background:var(--neg-bg);color:var(--neg)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.grey{background:var(--surface-3);color:var(--ink-2)}

.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:12px;font-family:inherit}

.paginate{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 2px;font-size:12px;color:var(--ink-2)}
.paginate button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600}
.paginate button:disabled{opacity:.4;cursor:default}

.dev{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:11px;padding:11px 14px;font-size:12px;color:var(--ink-2);margin-bottom:16px;flex-wrap:wrap}
.dev svg{width:16px;height:16px;color:var(--warn);flex:none;margin-top:1px}
.dev b{color:var(--ink)}
.dev.live{background:var(--pos-bg);border-color:color-mix(in srgb,var(--pos) 35%,transparent)}
.dev.live svg{color:var(--pos)}
.mode-toggle{display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--ink-3);flex:none}
.mode-toggle b{font-size:11px;color:var(--ink-2);margin-right:4px}
.mode-toggle button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
.mode-toggle button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* tooltip */
.chart-tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.chart-tip .tt{color:var(--ink-3);font-size:10.5px;margin-bottom:2px}
.chart-tip b{font-weight:800}

/* svg chart common */
.svgchart{width:100%;height:auto;display:block;overflow:visible}
.svgchart .gl{stroke:var(--grid);stroke-width:1}
.svgchart .axl{fill:var(--ink-3);font-size:10px}
.hoverbar:hover{opacity:.82;cursor:default}
.cx-line{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.cx-tag{fill:var(--brand)}
.cx-tagt{fill:#fff;font-size:10px;font-weight:700}
.ac-wrap .ac-tip{position:absolute;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:11.5px;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .1s;pointer-events:none;white-space:nowrap;z-index:5}
.ac-tip .tt{color:var(--ink-3);font-size:10px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.ac-tip .dotc{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.ac-tip b{font-variant-numeric:tabular-nums}
.ac-tip .chg{margin-top:4px;font-size:10.5px;font-weight:700}
.ac-tip .chg.up{color:var(--pos)}.ac-tip .chg.dn{color:var(--neg)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid var(--line)}
.modal-h{padding:18px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h .avatar{width:52px;height:52px;font-size:17px;border-radius:11px}
.ph-zoom{padding:0;border:0;background:none;cursor:zoom-in;border-radius:11px;flex:none;transition:transform .15s,box-shadow .15s}
.ph-zoom:hover{transform:scale(1.05);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
.ph-lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;cursor:zoom-out;animation:phIn .18s ease}
.ph-lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.ph-lb img{max-width:min(92vw,720px);max-height:80vh;border-radius:14px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.6);background:var(--surface-3);animation:phZoom .22s ease}
.ph-lb figcaption{color:#fff;font-weight:700;font-size:15px;text-align:center}.ph-lb figcaption span{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.ph-lb .x{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
@keyframes phIn{from{opacity:0}to{opacity:1}}@keyframes phZoom{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.modal-h .nm{font-size:16px;font-weight:800}
.modal-h .rl{font-size:12px;color:var(--ink-3);margin-top:2px}
.modal-h .x{margin-left:auto;border:0;background:var(--surface-2);width:31px;height:31px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:17px;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);padding:1px}
.kv .k{background:var(--surface);padding:10px 13px}
.kv .k .l{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kv .k .v{font-size:13px;font-weight:600;margin-top:3px;word-break:break-word;color:var(--ink)}
.modal-sec{padding:8px 18px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);font-weight:800;background:var(--surface-2)}

/* payslip */
.slip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.slip-h{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.slip-h .t{font-weight:800;font-size:15px}
.slip-h .s{font-size:11.5px;opacity:.85;margin-top:2px}
.slip-body{padding:18px}
.slip-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.slip-row.head{font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:6px}
.slip-row.total{border-top:2px solid var(--brand);border-bottom:0;font-weight:800;font-size:14px;margin-top:6px;padding-top:11px;color:var(--brand)}
.slip-2col{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ticket */
.tk-lane{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:9px;min-height:120px}
.tk-lane-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;padding:2px 4px}
.tk-lane-h .c{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--ink-2)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow)}
.tk .id{font-size:10px;color:var(--ink-3);font-weight:700;letter-spacing:.5px}
.tk .ti{font-weight:700;font-size:12.5px;margin:4px 0 8px;line-height:1.3;color:var(--ink)}
.tk .ft{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.prio{width:7px;height:7px;border-radius:50%;flex:none}

/* ===== LOGIN ===== */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#eaf1fb,#dde7f4 55%,#cdd9ea)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(16,32,45,.18);width:100%;max-width:400px;overflow:hidden}
.login-head{background:linear-gradient(135deg,#1F4E79,#2f6cb0);color:#fff;padding:26px 26px 22px;text-align:center}
.login-head img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:12px;padding:5px}
.login-head .t{font-weight:800;font-size:17px;margin-top:12px}
.login-head .s{font-size:12px;opacity:.85;margin-top:3px}
.login-body{padding:24px}
.login-body .field{margin-bottom:14px}
.login-body .btn{width:100%;justify-content:center;padding:12px}
.login-err{background:var(--neg-bg);color:var(--neg);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.login-demo{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.7}
.login-demo b{color:var(--ink-2)}
.login-demo code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:11px;cursor:pointer}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:11px}
/* employee landing */
.emp-hero{background:linear-gradient(135deg,#1F4E79,#2f6cb0);color:#fff;border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:var(--shadow)}
.emp-hero .avatar{width:66px;height:66px;font-size:22px;border-radius:16px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3)}
.emp-hero .nm{font-size:20px;font-weight:800}
.emp-hero .rl{font-size:13px;opacity:.9;margin-top:3px}
.emp-hero .st{margin-left:auto;text-align:right}
.emp-hero .clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.checkin-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:2px}
.checkin-btn{border:0;border-radius:12px;padding:16px 26px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:var(--pos);box-shadow:0 6px 18px rgba(22,163,74,.3);display:flex;align-items:center;gap:9px}
.checkin-btn.out{background:var(--c2);box-shadow:0 6px 18px rgba(199,116,0,.3)}
.checkin-btn:disabled{background:var(--ink-3);box-shadow:none;cursor:default}
.emp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:1px solid var(--line);padding-bottom:0}
.emp-tab{border:0;background:transparent;color:var(--ink-2);padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.emp-tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.acct-tbl code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:11px}
/* role picker (subscription-style cards) */
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role-card{border:2px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:all .15s;background:var(--surface);position:relative;display:flex;flex-direction:column}
.role-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 28px rgba(31,78,121,.12)}
.role-card.sel{border-color:var(--brand);background:var(--info-bg)}
.role-card .rc-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10px;font-weight:800;padding:3px 12px;border-radius:20px;letter-spacing:.3px}
.role-card .rc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.role-card .rc-ic svg{width:22px;height:22px}
.role-card .rc-name{font-weight:800;font-size:15px}
.role-card .rc-tag{font-size:11.5px;color:var(--ink-3);margin:3px 0 12px}
.role-card ul{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.role-card li{font-size:12px;display:flex;gap:7px;align-items:flex-start;color:var(--ink-2)}
.role-card li .ck{color:var(--pos);font-weight:800;flex:none}
.role-card li .xx{color:var(--ink-3);flex:none}
.role-card .rc-pick{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:9px;padding:9px;font-size:12.5px;font-weight:700;text-align:center;cursor:pointer}
.role-card.sel .rc-pick{background:var(--pos);border-color:var(--pos)}
@media (max-width:820px){.role-cards{grid-template-columns:1fr}}
/* activity feed */
.actfeed{display:flex;flex-direction:column}
.actitem{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.actitem:last-child{border-bottom:0}
.actdot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 15%,transparent)}
.actbody{flex:1;min-width:0;font-size:13px}
.actmeta{font-size:11px;color:var(--ink-3);margin-top:2px}
/* jabatan timeline */
.jtl{display:flex;flex-direction:column;gap:0;padding:4px 0}
.jtl-item{display:grid;grid-template-columns:52px 1fr;gap:10px;position:relative}
.jtl-yr{font-weight:800;font-size:12px;color:var(--brand);text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.jtl-body{border-left:2px solid var(--line);padding:0 0 14px 14px;position:relative}
.jtl-body::before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.jtl-item:last-child .jtl-body{border-left-color:transparent}
.jtl-jab{font-weight:700;font-size:13px}
.jtl-sub{font-size:11.5px;color:var(--ink-3)}
/* network graph */
.net-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.net-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.net-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:0}
.net-ctrls{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.net-stage{position:relative;height:min(76vh,680px);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 40%, #ffffff 0%, #eef3fa 45%, #dde8f5 100%)}
.net-stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.recnet-stage{position:relative;height:min(58vh,460px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 38%,#ffffff 0%,#eef4fb 45%,#dfeaf6 100%)}
.recnet-stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.recnet-stage .net-hint{background:rgba(255,255,255,.85);color:rgba(20,30,45,.6)}
.net-hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:rgba(20,30,45,.55);pointer-events:none;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:6px}
.net-search{position:absolute;top:12px;left:12px}
.net-search input{border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:8px;padding:7px 11px;font-size:12px;width:180px;font-family:inherit;color:var(--ink)}
.hm{display:grid;gap:0;min-width:560px}
/* garis kisi: border tipis pada tiap sel + border luar */
.hm-grid{border:1.5px solid #e3c4c4;border-radius:10px;overflow:hidden;background:#fff}
.hm-grid>div{border-right:1px solid #efd9d9;border-bottom:1px solid #efd9d9}
.hm-grid>div:last-child{border-right:0}
.hm-corner{background:#fbeaea}
.hm-h{font-size:12.5px;color:#7a1414;text-align:center;font-weight:800;padding:8px 2px;background:#fbeaea;letter-spacing:.3px}
.hm-rl{font-size:12.5px;color:#5a1010;display:flex;align-items:center;font-weight:800;padding:0 10px;background:#fbeaea;letter-spacing:.2px}
.hm-cell{position:relative;aspect-ratio:1.35;display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:transform .12s;overflow:hidden}
.hm-cell.hm-zero{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 5px,#f3f3f3 5px,#f3f3f3 10px)}
.hm-bub{position:absolute;border-radius:50%;opacity:.92;transition:transform .18s}
.hm-v{position:relative;z-index:1;font-weight:800}
.hm-cell:hover{z-index:2;transform:scale(1.12);outline:2px solid var(--brand)}
.hm-cell:hover .hm-bub{transform:scale(1.06)}
.hm-scale{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:11px;color:var(--ink-2)}
.hm-bar{width:120px;height:9px;border-radius:20px;background:linear-gradient(90deg,#ffeeee,#fac6c6,#d64242,#b80000,#780000)}
.empty{text-align:center;padding:36px;color:var(--ink-3);font-size:12.5px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rec-hist-box{--rh-ink:#7a3b0a;background:linear-gradient(180deg,#fff8f0 0%,#fdf1e4 100%);border:1px solid #f2d9bd;border-radius:18px;padding:18px 18px 20px;margin:18px 0 6px;box-shadow:0 1px 2px rgba(180,83,9,.05)}
.rec-hist-box .sec-h{margin:0 0 14px}
.rec-hist-box>.grid.tiles .tile,.rec-hist-box .card.panel{background:rgba(255,255,255,.72);border-color:#f0ddc6}

/* ========== APPS shared ========== */
.mail-cfg>svg{width:17px;height:17px;flex:none;color:var(--info)}
.mail-actionbar>svg,.cf-l svg{width:15px;height:15px;flex:none}
.avatar svg{width:18px;height:18px}
.cf-l{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.cf-l input,.cf-l textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--ink);background:var(--surface)}
.cf-l textarea{resize:vertical;line-height:1.55}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
/* ========== EMAIL ========== */
.mail-shell{display:grid;grid-template-columns:220px 320px 1fr;min-height:560px;overflow:hidden;padding:0}
.mail-side{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2,#fafbfc)}
.mail-folder{display:flex;align-items:center;gap:10px;padding:9px 11px;border:0;background:transparent;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left;width:100%}
.mail-folder svg{width:17px;height:17px}
.mail-folder:hover{background:var(--hover,#eef2f7)}
.mail-folder.on{background:var(--info-bg);color:var(--info)}
.mf-badge{margin-left:auto;background:var(--neg);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.mail-tag-h{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;margin:14px 0 6px 4px}
.mail-tag{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding:5px 4px}
.mail-tag .dotc{width:9px;height:9px;border-radius:50%}
.mail-list{border-right:1px solid var(--line);overflow-y:auto;max-height:640px}
.mail-list-h{padding:14px 16px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mail-list-h span{color:var(--ink-3);font-weight:500;margin-left:6px}
.mail-item{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.mail-item:hover{background:var(--hover,#f6f8fb)}
.mail-item.on{background:var(--info-bg)}
.mail-item.unread .mi-subj{font-weight:800}
.mail-item.unread .mi-from{font-weight:800}
.mi-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.mi-main{min-width:0;flex:1}
.mi-top{display:flex;justify-content:space-between;gap:8px}
.mi-from{font-size:12.5px;font-weight:600}
.mi-date{font-size:11px;color:var(--ink-3);white-space:nowrap}
.mi-subj{font-size:12.5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-tagdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.mi-prev{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-read{overflow-y:auto;max-height:640px;display:flex;flex-direction:column}
.mr-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mr-subj{font-size:17px;font-weight:800;margin-bottom:11px}
.mr-meta{display:flex;gap:11px;align-items:center}
.mail-actionbar{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--warn-bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mr-body{padding:20px;font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
/* ========== CHAT ========== */
.chat-shell{display:grid;grid-template-columns:260px 1fr;min-height:560px;overflow:hidden;padding:0}
.chat-side{border-right:1px solid var(--line);padding:12px;background:var(--surface-2,#fafbfc);overflow-y:auto}
.chat-side-h{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;margin:4px 4px 10px}
.chat-room{display:flex;gap:11px;align-items:center;padding:10px;border-radius:11px;cursor:pointer;margin-bottom:3px}
.chat-room:hover{background:var(--hover,#eef2f7)}
.chat-room.on{background:var(--info-bg)}
.cr-av{width:40px;height:40px;border-radius:50%;background:var(--info-bg);color:var(--info);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.cr-av.grp{background:#1F4E7915;color:var(--info)}
.cr-av svg{width:19px;height:19px}
.cr-nm{font-size:13px;font-weight:700}
.cr-sub{font-size:11px;color:var(--ink-3)}
.chat-main{display:flex;flex-direction:column;min-height:560px}
.chat-top{display:flex;gap:11px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:520px;background:var(--surface-2,#fafbfc)}
.cb-row{display:flex;gap:10px;max-width:74%}
.cb-row.me{flex-direction:row-reverse;align-self:flex-end}
.cb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0}
.cb-bub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 13px}
.cb-row.me .cb-bub{background:var(--info);border-color:var(--info)}
.cb-row.me .cb-by,.cb-row.me .cb-t,.cb-row.me .cb-ts{color:#fff}
.cb-by{font-size:11px;font-weight:700;color:var(--info);margin-bottom:2px}
.cb-t{font-size:13px;line-height:1.5;color:var(--ink)}
.cb-ts{font-size:10px;color:var(--ink-3);margin-top:3px;text-align:right}
.chat-input{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line)}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:22px;padding:11px 16px;font-size:13px;color:var(--ink);background:var(--surface)}
/* ========== CALENDAR ========== */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.cal-top{display:flex;align-items:center;gap:10px;padding:6px 4px 14px}
.cal-title{font-size:17px;font-weight:800;min-width:150px;text-align:center}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 4px 12px;font-size:11.5px;color:var(--ink-2)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:11px;height:11px;border-radius:3px}
.cal-fchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600;cursor:pointer;opacity:.55}
.cal-fchip.on{opacity:1;color:var(--ink);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,transparent)}
.cal-fchip i{width:10px;height:10px;border-radius:3px}
.cal-grid-h{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-grid-h div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:5px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cal-cell.out{background:transparent;border:0}
.cal-cell.today{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}
.cal-d{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.cal-cell.today .cal-d{color:var(--info)}
.cal-ev{font-size:10px;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal-more{font-size:9.5px;color:var(--ink-3);padding-left:3px}
.ag-item{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--surface-2,#fafbfc);margin-bottom:7px}
.ag-dt{font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap;min-width:52px}
.ag-t{font-size:12.5px;font-weight:600}
.ag-sub{font-size:11px;color:var(--ink-3)}
@media (max-width:1100px){.mail-shell{grid-template-columns:1fr}.mail-side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.mail-list{border-right:0;border-bottom:1px solid var(--line);max-height:300px}.chat-shell{grid-template-columns:1fr}.chat-side{border-right:0;border-bottom:1px solid var(--line)}.cal-wrap{grid-template-columns:1fr}}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;height:100dvh;z-index:70;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65}
  .scrim.on{display:block}
  .burger{display:grid}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .two-col,.three-col{grid-template-columns:1fr}
  .meters{grid-template-columns:repeat(2,1fr)}
  .slip-2col{grid-template-columns:1fr;gap:0}
  .search input{width:150px}
}
@media (max-width:560px){
  .content{padding:13px}
  .topbar{padding:10px 13px}
  .topbar .sub,.crumb{display:none}
  .search input{width:118px}
  .kv{grid-template-columns:1fr}
  .tk-board{grid-template-columns:1fr!important}
}

/* ===== FORMS (manage / upload) ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--ink-2);font-weight:600;letter-spacing:.2px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.field .hh{font-size:10.5px;color:var(--ink-3)}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:15px;height:15px}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink-2);cursor:pointer;transition:all .15s;background:var(--surface-2)}
.dropzone.drag{border-color:var(--brand);background:var(--info-bg)}
.dropzone svg{width:30px;height:30px;color:var(--brand);opacity:.8}

/* ---------- data + helpers ---------- */
if(window.pdfjsLib)try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}
const DATA=(window.EMP_DATA||[]).filter(e=>e.nama);
/* merge locally-added employees (localStorage) */
const LS_KEY='sdm-alwildan-emps';
function loadLocal(){try{const j=localStorage.getItem(LS_KEY);if(j){const arr=JSON.parse(j);if(Array.isArray(arr)){arr.forEach(e=>{e._local=true;const i=DATA.findIndex(x=>x.id===e.id);if(i>=0)DATA[i]=e;else DATA.push(e);});}}}catch(e){}}

function newId(){return 'NEW-'+Date.now().toString(36)+Math.floor(Math.random()*900+100);}

/* blank employee template with health + docs */
function blankEmp(){return {id:newId(),nama:'',jabatan:'',gender:'',gelar:'',mapel:'',thnAktif:String(new Date().getFullYear()),thp:0,unit:'',cabang:'',nikKtp:'',alamat:'',tmpLahir:'',tglLahir:'',usia:'',status:'',transport:'',posisi:'',mapelGuru:'',s1univ:'',s1prodi:'',s1ipk:'',s2univ:'',s3univ:'',gajiAjuan:0,rekBSI:'',rekLain:'',namaBank:'',tinggi:'',berat:'',email:'',noHp:'',photo:'',linkKesehatan:'',linkCV:'',linkPegawai:'',thpKotor:0,thpBersih:0,tk:0,thr:0,golDarah:'',riwayatSakit:'',alergi:'',kontakDarurat:'',_local:true};}
/* parse AL-WILDAN PDF text into an emp record (best-effort) */
function parseALWildan(text){const e=blankEmp();const t=text.replace(/\r/g,'');
 const grab=(re)=>{const m=t.match(re);return m?m[1].trim():'';};
 const money=(s)=>{const n=parseInt(String(s).replace(/[^\d]/g,''));return isFinite(n)?n:0;};
 e.nama=grab(/Nama Lengkap[^:]*:\s*([^\n]+?)(?:\s+[\w.+-]+@|\n)/i)||grab(/Nama Lengkap[^:]*:\s*([^\n]+)/i);
 e.email=grab(/([\w.+-]+@[\w-]+\.[\w.-]+)/);
 e.noHp=grab(/wa\.me\/(\d+)/)||grab(/No HP[^:]*:\s*([^\n]+)/i);
 e.nikKtp=grab(/NIK KTP\s*:?\s*(\d{6,})/i);
 e.alamat=grab(/Alamat Domisili[^:]*:\s*([^\n]+)/i);
 e.tmpLahir=grab(/Tempat Lahir\s*:?\s*([^\n]+)/i);
 e.tglLahir=grab(/Tanggal Lahir\s*:?\s*([0-9]{1,2}[-/][0-9]{1,2}[-/][0-9]{2,4})/i);
 e.usia=grab(/Usia Sekarang\s*:?\s*([^\n]+tahun[^\n]*)/i);
 e.status=grab(/\bStatus\b\s*:?\s*(Lajang|Menikah|[^\n]+)/i);
 e.transport=grab(/Transport[^:]*:\s*([^\n]+)/i);
 e.posisi=grab(/Posisi yang diajukan\s*:?\s*([^\n]+)/i)||'Guru Mata Pelajaran';
 e.jabatan=e.posisi;
 e.mapel=grab(/Mata Pelajaran\s*:?\s*([^\n]+)/i);e.mapelGuru=e.mapel;
 const cab=grab(/Cabang AL?-?Wildan\s*:?\s*([^\n]+)/i);e.cabang=cab;
 const am=cab.match(/(\d+)/);if(am)e.unit='AW '+am[1];
 e.tinggi=grab(/Tinggi Badan\s*:?\s*(\d+)/i);e.berat=grab(/Berat Badan\s*:?\s*(\d+)/i);
 e.s1univ=grab(/S1\)\s*:?\s*([^\n]+)/i)||grab(/Lulusan[^\n]*S1[^\n]*:\s*([^\n]+)/i);
 e.s1ipk=grab(/IPK\s*:?\s*(\d\.\d+)/i);
 e.gelar=e.s1univ?'S1':'';
 e.gajiAjuan=money(grab(/GAJI YANG DIAJUKAN[^:]*:?\s*Rp\.?\s*([\d.,\s-]+)/i));
 e.rekBSI=grab(/BSI[^:]*:?\s*(\d{6,})/i);
 e.rekLain=grab(/rekening Lain[^:]*:?\s*(\d{6,})/i);
 e.namaBank=grab(/Nama Bank Lain\s*:?\s*([^\n]+)/i);
 e.thpKotor=money(grab(/THP KOTOR[\s\S]{0,40}?Rp([\d.]+)/i));
 e.thpBersih=money(grab(/THP BERSIH[\s\S]{0,40}?Rp([\d.]+)/i));
 e.thp=e.thpBersih||e.thpKotor||e.gajiAjuan;
 e.tk=money(grab(/\bTK\b[\s\S]{0,30}?Rp([\d.]+)/i));e.thr=money(grab(/THR[^R]{0,30}?Rp([\d.]+)/i));
 e.linkKesehatan=grab(/(https:\/\/docs\.google\.com\/document\/[^\s\)]+)/i);
 e.linkCV=grab(/(https:\/\/drive\.google\.com\/file\/[^\s\)]+)/i);
 e.thnAktif=grab(/Aktif[^0-9]*(\d{4})/i)||e.thnAktif;
 return e;}
async function parsePdfFile(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let text='';
 for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
   // reconstruct lines by y
   let last=null,line='';const lines=[];
   c.items.forEach(it=>{const y=Math.round(it.transform[5]);if(last!==null&&Math.abs(y-last)>4){lines.push(line);line='';}line+=(line?' ':'')+it.str;last=y;});
   if(line)lines.push(line);text+=lines.join('\n')+'\n';}
 return text;}
const fmtID=new Intl.NumberFormat('id-ID');
const rp=n=>'Rp'+fmtID.format(Math.round(n||0));
const rpShort=n=>{n=n||0;if(n>=1e9)return 'Rp'+(n/1e9).toFixed(2)+' M';if(n>=1e6)return 'Rp'+(n/1e6).toFixed(1)+' jt';if(n>=1e3)return 'Rp'+(n/1e3).toFixed(0)+' rb';return 'Rp'+n;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function initials(n){const p=String(n||'').replace(/,.*/,'').trim().split(/\s+/).filter(Boolean);return(((p[0]||'')[0]||'')+((p[1]||'')[0]||'')||'?').toUpperCase();}
function driveId(u){u=String(u||'');const m=u.match(/\/d\/([A-Za-z0-9_-]+)/)||u.match(/[?&]id=([A-Za-z0-9_-]+)/)||u.match(/thumbnail\?id=([A-Za-z0-9_-]+)/);return m?m[1]:'';}
function photoURL(p){const id=driveId(p);return id?('https://lh3.googleusercontent.com/d/'+id+'=w300'):String(p||'');}
function avatar(e,cls){const c=cls||'avatar';const ini=initials(e.nama);
 if(e.photo){const u=photoURL(e.photo);
   return `<img class="${c}" loading="lazy" src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.onerror=null;this.outerHTML='<div class=&quot;${c}&quot;>${ini}</div>'">`;}
 return `<div class="${c}">${ini}</div>`;}
function roleGroup(e){const j=(e.jabatan||'').toLowerCase(),p=(e.posisi||'').toLowerCase();
  if(j.includes('guru')||p.includes('guru'))return 'Guru';
  if(j.includes('itba')||j.includes('musyrif')||j.includes('muhafiz')||j.includes('native')||p.includes('musyrif')||p.includes('itba'))return 'Pengasuhan/ITBA';
  if(j.includes('security')||j.includes('fcs')||j.includes('dapur')||j.includes('laundry')||j.includes('kebun')||j.includes('sarpras')||p.includes('cleaning')||p.includes('cctv'))return 'Support/Sarpras';
  if(j.includes('management')||j.includes('kepala')||j.includes('finance')||j.includes('keuangan')||j.includes('humas')||j.includes('staff')||p.includes('management')||p.includes('finance')||p.includes('tata usaha')||p.includes('marketing'))return 'Manajemen/Staf';
  return 'Lainnya';}
function eduLevel(e){if(e.s3univ)return 'S3';if(e.s2univ)return 'S2';if(e.s1univ)return 'S1';const g=String(e.gelar||'').toUpperCase();if(g.includes('S3'))return 'S3';if(g.includes('S2'))return 'S2';if(g.includes('S1'))return 'S1';if(g&&g!=='NONE'&&g!=='0')return 'SMA/D3/Lainnya';return 'Tidak diisi';}
function ageOf(e){const m=String(e.usia||'').match(/(\d+)\s*tahun/);return m?+m[1]:null;}

function tenureYears(e){const y=String(e.thnAktif).trim();if(!/^\d{4}$/.test(y))return null;return NOW_YEAR-(+y);}
function tenureCat(e){const t=tenureYears(e);if(t==null)return null;return t<1?'<1 th':t<=2?'1-2 th':t<=4?'3-4 th':t<=6?'5-6 th':'>6 th';}
function ageCat(e){const a=ageOf(e);if(a==null)return null;return a<25?'<25':a<=30?'25-30':a<=35?'31-35':a<=40?'36-40':a<=45?'41-45':a<=50?'46-50':'>50';}
function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295;}
/* helper aman utk array kosong (anti-crash saat data ter-reset ke nol) */
function maxV(a){return a&&a.length?Math.max.apply(null,a):0;}

const byUnit=agg(e=>e.unit||'—');

const genders=(()=>{let pria=0,pr=0,x=0;DATA.forEach(e=>{if(e.gender==='Pria')pria++;else if(e.gender==='Perempuan')pr++;else x++});return{pria,pr,x};})();

function tile(lbl,val,opt){opt=opt||{};const money=typeof val==='string'&&val.startsWith('Rp');
 let t='';if(opt.trend!=null){const dir=opt.trend>0?'up':opt.trend<0?'down':'flat';t=`<span class="trend ${dir}">${dir==='up'?ic('up'):dir==='down'?ic('down'):''}${opt.trend>0?'+':''}${opt.trend}%</span>`;}
 const clk=opt.onclick?` onclick="${opt.onclick}" style="cursor:pointer"`:'';const arrow=opt.onclick?'<span class="tile-go">→</span>':'';
 return `<div class="tile${opt.onclick?' clickable':''}"${clk}><div class="lbl">${opt.color?`<span class="dot" style="background:${opt.color}"></span>`:''}${lbl}${arrow}</div><div class="val tnum${money?' money':''}" title="${esc(val)}">${val}</div><div class="row2">${t}${opt.meta?`<span class="meta">${opt.meta}</span>`:''}</div></div>`;}

function barChart(rows,opt){opt=opt||{};const mx=opt.max||Math.max(...rows.map(r=>r[1]),1);const col=opt.color||'var(--c1)';
 const clk=opt.drill?` onclick="drillList('${opt.drill}',this.dataset.cat)" style="cursor:pointer"`:'';
 return `<div class="bars">`+rows.map((r,i)=>`<div class="bar-row"><span class="nm" title="${esc(r[0])}">${esc(r[0])}</span><div class="bar-track"${clk} data-cat="${esc(r[0])}"><div class="bar-fill hoverbar" data-tip="${esc(r[0])}: ${opt.fmt?opt.fmt(r[1]):fmtID.format(r[1])}${opt.drill?' · klik untuk lihat SDM':''}" style="width:${(r[1]/mx*100).toFixed(1)}%;background:${typeof col==='function'?col(i):col}"></div></div><span class="vv tnum">${opt.fmt?opt.fmt(r[1]):fmtID.format(r[1])}</span></div>`).join('')+`</div>`;}

function donut(parts,unitLbl,drill){const total=parts.reduce((a,p)=>a+p.val,0)||1;let acc=0;const R=52,C=2*Math.PI*R;
 const dc=drill?p=>` onclick="drillList('${drill}','${p.label.replace(/'/g,"")}')" style="cursor:pointer"`:()=>'';
 const segs=parts.map(p=>{const frac=p.val/total;const seg=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${p.color}" stroke-width="18" stroke-dasharray="${(frac*C-2).toFixed(2)} ${(C-frac*C+2).toFixed(2)}" stroke-dashoffset="${(-acc*C).toFixed(2)}" transform="rotate(-90 66 66)" class="hoverbar"${dc(p)} data-tip="${esc(p.label)}: ${fmtID.format(p.val)} (${(frac*100).toFixed(0)}%)${drill?' · klik untuk daftar':''}"/>`;acc+=frac;return seg;}).join('');
 return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
   <svg width="132" height="132" viewBox="0 0 132 132" style="flex:none">${segs}<text x="66" y="62" text-anchor="middle" font-size="21" font-weight="800" fill="var(--ink)">${fmtID.format(total)}</text><text x="66" y="80" text-anchor="middle" font-size="9" fill="var(--ink-3)">${esc(unitLbl||'TOTAL')}</text></svg>
   <div class="legend" style="flex:1;min-width:150px">${parts.map(p=>`<div class="li"${drill?` onclick="drillList('${drill}','${p.label.replace(/'/g,"")}')" style="cursor:pointer"`:''}><span class="sw" style="background:${p.color}"></span><span class="n">${esc(p.label)}</span><span class="v tnum">${fmtID.format(p.val)} · ${(p.val/total*100).toFixed(0)}%</span></div>`).join('')}</div>
 </div>`;}

/* area/line chart with hover crosshair. series:[{name,data:[..],color}], labels:[..] */
let _acSeq=0;const _acStore={};
function areaChart(series,labels,opt){opt=opt||{};const W=680,H=210,PL=42,PR=16,PT=16,PB=28;
 const iw=W-PL-PR,ih=H-PT-PB;const all=series.flatMap(s=>s.data);const mx=Math.max(...all,1);const ticks=4;
 const x=i=>PL+(labels.length<=1?iw/2:i/(labels.length-1)*iw);const y=v=>PT+ih-(v/mx)*ih;
 let grid='';for(let t=0;t<=ticks;t++){const gv=mx*t/ticks;const gy=PT+ih-(t/ticks)*ih;grid+=`<line class="gl" x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}"/><text class="axl" x="${PL-7}" y="${gy+3}" text-anchor="end">${gv>=1000?Math.round(gv/1000)+'k':Math.round(gv)}</text>`;}
 let xl='';labels.forEach((l,i)=>{if(labels.length>12&&i%2)return;xl+=`<text class="axl" x="${x(i)}" y="${H-9}" text-anchor="middle">${esc(l)}</text>`;});
 const id='ac'+(_acSeq++);
 const paths=series.map((s,si)=>{const line=s.data.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');const area=line+` L ${x(s.data.length-1).toFixed(1)} ${(PT+ih)} L ${x(0).toFixed(1)} ${(PT+ih)} Z`;
   return `<defs><linearGradient id="${id}_${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity="0.30"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id}_${si})"/><path d="${line}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`+s.data.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`).join('');}).join('');
 // crosshair overlay elements (hidden until hover)
 const cross=`<g id="${id}_cross" style="opacity:0;pointer-events:none">
   <line id="${id}_vx" class="cx-line" y1="${PT}" y2="${PT+ih}"/>
   <line id="${id}_hy" class="cx-line" x1="${PL}" x2="${W-PR}"/>
   <circle id="${id}_dot" r="5.5" fill="none" stroke-width="2.5"/>
   <g id="${id}_xtag"><rect class="cx-tag" rx="3" height="16" y="${PT+ih+3}"/><text class="cx-tagt" y="${PT+ih+14}" text-anchor="middle"></text></g>
   <g id="${id}_ytag"><rect class="cx-tag" rx="3" height="16" width="40" x="1"/><text class="cx-tagt" x="21" text-anchor="middle"></text></g>
 </g>`;
 _acStore[id]={labels,series,x:Array.from({length:labels.length},(_,i)=>x(i)),ys:series.map(s=>s.data.map(v=>y(v))),vals:series.map(s=>s.data),PL,PR,W,PT,ih};
 return `<div class="ac-wrap" style="position:relative"><svg class="svgchart" viewBox="0 0 ${W} ${H}" data-ac="${id}" onmousemove="acMove(event,'${id}')" onmouseleave="acLeave('${id}')" ontouchmove="acMove(event,'${id}')">${grid}${paths}${cross}</svg>${xl?'<svg class="svgchart" viewBox="0 0 '+W+' '+H+'" style="position:absolute;inset:0;pointer-events:none">'+xl+'</svg>':''}<div class="ac-tip" id="${id}_tip"></div></div>`;}
function acMove(ev,id){const s=_acStore[id];if(!s)return;const svg=ev.currentTarget;const r=svg.getBoundingClientRect();
 const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);const px=(cx-r.left)/r.width*s.W;
 let idx=0,best=1e9;s.x.forEach((xx,i)=>{const d=Math.abs(xx-px);if(d<best){best=d;idx=i;}});
 const g=document.getElementById(id+'_cross');if(!g)return;g.style.opacity='1';
 const X=s.x[idx];const Y=s.ys[0][idx];const col=s.series[0].color;
 document.getElementById(id+'_vx').setAttribute('x1',X);document.getElementById(id+'_vx').setAttribute('x2',X);
 document.getElementById(id+'_hy').setAttribute('y1',Y);document.getElementById(id+'_hy').setAttribute('y2',Y);
 const dot=document.getElementById(id+'_dot');dot.setAttribute('cx',X);dot.setAttribute('cy',Y);dot.setAttribute('stroke',col);
 const xt=document.getElementById(id+'_xtag');const xtr=xt.querySelector('rect'),xtt=xt.querySelector('text');xtt.textContent=s.labels[idx];const wpx=s.labels[idx].length*6.5+12;xtr.setAttribute('width',wpx);xtr.setAttribute('x',X-wpx/2);xtt.setAttribute('x',X);
 const yt=document.getElementById(id+'_ytag');const ytt=yt.querySelector('text');ytt.textContent=fmtID.format(s.vals[0][idx]);yt.querySelector('rect').setAttribute('y',Y-8);ytt.setAttribute('y',Y+4);
 const tip=document.getElementById(id+'_tip');const pctChg=idx>0?((s.vals[0][idx]-s.vals[0][idx-1])/(s.vals[0][idx-1]||1)*100):0;
 tip.innerHTML=`<div class="tt">${esc(s.labels[idx])}</div>`+s.series.map((se,si)=>`<div><span class="dotc" style="background:${se.color}"></span><b>${fmtID.format(s.vals[si][idx])}</b> ${esc(se.name)}</div>`).join('')+(idx>0?`<div class="chg ${pctChg>=0?'up':'dn'}">${pctChg>=0?'▲':'▼'} ${Math.abs(pctChg).toFixed(0)}% vs ${esc(s.labels[idx-1])}</div>`:'');
 tip.style.opacity='1';const lx=X/s.W*r.width;tip.style.left=Math.min(Math.max(lx,60),r.width-70)+'px';tip.style.top='6px';}
function acLeave(id){const g=document.getElementById(id+'_cross');if(g)g.style.opacity='0';const t=document.getElementById(id+'_tip');if(t)t.style.opacity='0';}

/* heatmap: rowLabels, colLabels, matrix[r][c], color scale one-hue */
function heatmap(rowLabels,colLabels,matrix,drill){let mx=1;matrix.forEach(r=>r.forEach(v=>{if(v>mx)mx=v;}));
 // gradasi merah sekuensial: merah muda -> merah tua/panas (standar warna AL-WILDAN)
 const redScale=t=>{const stops=[[255,238,238],[250,198,198],[238,132,132],[214,66,66],[184,0,0],[120,0,0]];const p=Math.max(0,Math.min(1,t))*(stops.length-1);const i=Math.floor(p),f=p-i;const a=stops[i],b=stops[Math.min(i+1,stops.length-1)];return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;};
 const cell=(v,ri,ci)=>{const t=v/mx;
   const clk=drill?` onclick="drillHeat('${drill}','${esc(rowLabels[ri])}','${esc(colLabels[ci])}')" style="cursor:pointer"`:'';
   if(v===0)return `<div class="hm-cell hm-zero"${clk}></div>`;
   // font membesar mengikuti nilai (11px → 21px); warna teks makin gelap → putih saat panas
   const fs=(11+t*10).toFixed(1);
   const bub=redScale(0.20+t*0.80);               // warna bubble (isi)
   const bsz=(34+t*54).toFixed(0);                 // diameter bubble % dari sel (34%→88%)
   const glow=t>0.55?`box-shadow:0 0 ${(4+t*14).toFixed(0)}px ${redScale(0.55+t*0.45)}`:'';
   const tint=v===0?'transparent':redScale(0.05+t*0.28); // tint sel latar
   const txt=t>0.5?'#fff':'#6e0f0f';
   return `<div class="hm-cell hoverbar" data-tip="${esc(rowLabels[ri])} · ${esc(colLabels[ci])}: ${v} bergabung"${clk} style="background:${tint}">
     <span class="hm-bub" style="width:${bsz}%;height:${bsz}%;background:${bub};${glow}"></span>
     <span class="hm-v" style="font-size:${fs}px;color:${txt}">${v}</span></div>`;};
 return `<div style="overflow-x:auto"><div class="hm hm-grid" style="grid-template-columns:74px repeat(${colLabels.length},minmax(46px,1fr))">
   <div class="hm-corner"></div>${colLabels.map(c=>`<div class="hm-h">${esc(c)}</div>`).join('')}
   ${rowLabels.map((rl,ri)=>`<div class="hm-rl">${esc(rl)}</div>`+matrix[ri].map((v,ci)=>cell(v,ri,ci)).join('')).join('')}
 </div>
 <div class="hm-scale"><span>0</span><div class="hm-bar"></div><span>${mx}</span><span style="color:var(--ink-3);margin-left:8px">karyawan bergabung · sel makin panas & besar = makin banyak</span></div></div>`;}
function drillHeat(type,rowV,colV){/* row=unit, col=year */const list=DATA.filter(e=>e.unit===rowV&&String(e.thnAktif).trim()===colV);
 const rows=list.map(e=>`<tr onclick="drillOpen('${e.id}')" style="cursor:pointer"><td><div class="emp-cell">${avatar(e)}<div><div class="nm">${esc(e.nama)}</div><div class="sm">${esc(e.jabatan||'')}</div></div></div></td><td><span class="pill info">${esc(e.unit)}</span></td><td class="tnum">${esc(e.thnAktif)}</td><td class="tnum">${e.thp>0?rp(e.thp):'—'}</td></tr>`).join('');

 const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';bindTips();}

     <div style="text-align:center;color:var(--ink-3);font-weight:700">${esc(r.label)}</div>

function empStatus(e){return e.statusKerja||'Aktif';}
function statusPill(e){const s=empStatus(e);const m={'Aktif':'pos','Nonaktif':'warn','Mutasi':'info','Promosi':'info','Resign':'grey','PTDH':'neg'};return `<span class="pill ${m[s]||'grey'}"><span class="d" style="background:currentColor"></span>${s}</span>`;}
const ACTIONS={
 mutasi:{label:'Mutasi Antar Cabang',needUnit:true,sets:e=>({statusKerja:'Aktif'}),ic:'mutasi',col:'var(--info)'},
 promosi:{label:'Promosi Jabatan',needJab:true,sets:e=>({statusKerja:'Aktif'}),ic:'up',col:'var(--pos)'},
 demosi:{label:'Demosi Jabatan',needJab:true,sets:e=>({statusKerja:'Aktif'}),ic:'down',col:'var(--warn)'},
 nonaktif:{label:'Nonaktifkan',sets:e=>({statusKerja:'Nonaktif'}),col:'var(--warn)'},
 aktif:{label:'Aktifkan Kembali',sets:e=>({statusKerja:'Aktif'}),col:'var(--pos)'},
 resign:{label:'Resign',sets:e=>({statusKerja:'Resign'}),col:'var(--ink-3)'},
 ptdh:{label:'PTDH (Pemberhentian)',sets:e=>({statusKerja:'PTDH'}),col:'var(--neg)'},
};

function pushActivity(a){try{const arr=loadActivity();arr.unshift(a);localStorage.setItem(ACT_KEY,JSON.stringify(arr.slice(0,200)));}catch(e){}}
let actState=null;
function openAction(id){const e=DATA.find(x=>x.id==id);if(!e)return;actState={emp:e,type:'mutasi',file:''};

function renderActionModal(){const e=actState.emp;const a=ACTIONS[actState.type];
 const html=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:520px">
   <div class="modal-h">${avatar(e,'avatar')}<div><div class="nm">Aksi SDM — ${esc(e.nama.split(',')[0])}</div><div class="rl">${esc(e.unit||'')} · ${esc(e.jabatan||'')} · ${empStatus(e)}</div></div><button class="x" onclick="closeModal()">×</button></div>
   <div style="padding:16px 18px">
     <div class="field"><label>Jenis Aksi</label>
       <select id="ac_type" onchange="actState.type=this.value;renderActionModal()">
         ${Object.entries(ACTIONS).map(([k,v])=>`<option value="${k}" ${actState.type===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
     ${a.needUnit?`<div class="field" style="margin-top:10px"><label>Cabang Tujuan</label><select id="ac_unit"><option value="">Pilih cabang…</option>${UNITS.filter(u=>u!==e.unit).map(u=>`<option>${esc(u)}</option>`).join('')}</select><span class="hh">Dari <b>${esc(e.unit||'—')}</b> ke cabang baru</span></div>`:''}
     ${a.needJab?`<div class="field" style="margin-top:10px"><label>Jabatan Baru</label><input id="ac_jab" placeholder="cth: Wakil Kepala Sekolah" value=""><span class="hh">Sebelumnya: ${esc(e.jabatan||'—')}</span></div>`:''}
     <div class="field" style="margin-top:10px"><label>Tanggal Berlaku</label><input id="ac_tgl" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
     <div class="field" style="margin-top:10px"><label>Alasan / Keterangan</label><textarea id="ac_reason" rows="3" placeholder="Tuliskan alasan, atau akan terisi otomatis dari teks file yang diupload…"></textarea></div>
     <div class="field" style="margin-top:10px"><label>Lampiran Dokumen (SK / Surat Resign / PTDH) — PDF</label>
       <div class="dropzone" style="padding:16px" onclick="document.getElementById('ac_file').click()">${ic('upload')}<div class="t" style="font-size:12.5px">Upload PDF lampiran</div><div class="s" id="ac_fname">Teks dokumen akan dibaca untuk remarks</div></div>
       <input type="file" id="ac_file" accept="application/pdf" hidden onchange="acReadFile(this.files[0])"></div>
     ${e.riwayat&&e.riwayat.length?`<div style="margin-top:14px"><div class="l" style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:6px">Riwayat SDM</div>${e.riwayat.map(r=>`<div style="font-size:12px;border-left:2px solid var(--brand);padding:2px 0 6px 10px;margin-bottom:4px"><b>${esc(r.aksi)}</b> · ${esc(r.tgl)}<br><span style="color:var(--ink-2)">${esc(r.ket||'')}</span>${r.file?` · 📎 ${esc(r.file)}`:''}</div>`).join('')}</div>`:''}
     <div style="display:flex;gap:10px;margin-top:16px">
       <button class="btn" onclick="applyAction()">${ic('plus')} Terapkan & Update Database</button>
       <button class="btn ghost" onclick="closeModal()">Batal</button>
     </div>

 closeModalSilent();const el=document.createElement('div');el.id='modalRoot';el.innerHTML=html;document.body.appendChild(el);document.body.style.overflow='hidden';
 const rs=document.getElementById('ac_reason');if(rs&&actState.reason)rs.value=actState.reason;}
async function acReadFile(file){if(!file)return;actState.file=file.name;document.getElementById('ac_fname').textContent=file.name+' — membaca…';
 try{const text=await parsePdfFile(file);actState.reason=text.replace(/\s+/g,' ').trim().slice(0,600);document.getElementById('ac_fname').textContent=file.name+' ✓ teks terbaca';const rs=document.getElementById('ac_reason');if(rs&&!rs.value.trim())rs.value=actState.reason;}
 catch(e){document.getElementById('ac_fname').textContent=file.name+' (nama tersimpan; teks tidak terbaca)';}}
function applyAction(){const e=actState.emp;const a=ACTIONS[actState.type];const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
 const tgl=g('ac_tgl')||new Date().toISOString().slice(0,10);let ket=g('ac_reason').trim();let aksiLabel=a.label;
 const thn=(tgl.match(/^(\d{4})/)||[])[1]||String(NOW_YEAR);const jabLama=e.jabatan||'—',unitLama=e.unit||'—';
 if(a.needUnit){const nu=g('ac_unit');if(!nu){toast('Pilih cabang tujuan',true);return;}ket=(ket?ket+' · ':'')+'Mutasi '+(e.unit||'—')+' → '+nu;e.unit=nu;e.cabang=nu;}
 if(a.needJab){const nj=g('ac_jab').trim();if(!nj){toast('Isi jabatan baru',true);return;}ket=(ket?ket+' · ':'')+(actState.type==='demosi'?'Demosi: ':'Promosi: ')+(e.jabatan||'—')+' → '+nj;e.jabatan=nj;e.posisi=nj;}
 Object.assign(e,a.sets(e));
 e.riwayat=e.riwayat||[];e.riwayat.unshift({aksi:aksiLabel,tgl,ket,file:actState.file||''});
 // riwayat jabatan per tahun (untuk tracking)
 e.riwayatJabatan=e.riwayatJabatan||[];e.riwayatJabatan.unshift({thn,jabatan:e.jabatan,unit:e.unit,aksi:aksiLabel});
 e._local=true;const i=DATA.findIndex(x=>x.id===e.id);if(i>=0)DATA[i]=e;else DATA.push(e);
 saveLocal(e);
 pushActivity({ts:Date.now(),tgl,aksi:aksiLabel,type:actState.type,col:a.col||'var(--ink-3)',nama:e.nama,id:e.id,unit:e.unit,ket,by:(SESSION&&SESSION.nama)||'Admin Holding'});
 toast('✓ '+aksiLabel+' diterapkan · database SDM diperbarui');
 closeModal();paint();}

function collectForm(){const e=editEmp;const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};

 ['thp','gajiAjuan','thpKotor','thr','tk'].forEach(k=>{const v=g('f_'+k).replace(/[^\d]/g,'');e[k]=v?parseInt(v):0;});
 e.linkPegawai=g('lk_pegawai');e.linkKesehatan=g('lk_health');e.linkCV=g('lk_cv');

/* ---- Rekap presensi NYATA dari check-in karyawan (localStorage key: sdm-ck-<id>-<tgl>) ---- */
function attScan(prefixDate){/* prefixDate: 'YYYY-MM-DD' (harian) atau 'YYYY-MM' (bulanan) */
 const rec={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k.indexOf('sdm-ck-')!==0)continue;
   const rest=k.slice(7);const dpos=rest.search(/-\d{4}-\d{2}-\d{2}$/);if(dpos<0)continue;
   const id=rest.slice(0,dpos);const tgl=rest.slice(dpos+1);if(prefixDate&&tgl.indexOf(prefixDate)!==0)continue;
   let c={};try{c=JSON.parse(localStorage.getItem(k))||{};}catch(e){}
   (rec[id]=rec[id]||[]).push({tgl,in:c.in||'',out:c.out||''});}}catch(e){}
 return rec;}
function attCountForDay(dstr){const rec=attScan(dstr);let hadir=0,terlambat=0;const rows=[];
 Object.keys(rec).forEach(id=>{const e=DATA.find(x=>x.id==id);if(!e)return;const c=rec[id][0]||{};const jam=c.in||'';
   const late=jam&&jam>'07:00';if(late)terlambat++;else hadir++;
   rows.push({e,st:late?'Terlambat':'Hadir',cls:late?'warn':'pos',tin:jam||'—'});});
 return {hadir,terlambat,rows};}
function renderAttendance(){
 const demo=isDemo();
 const today=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const monKey=new Date().toISOString().slice(0,7);
 const monLbl=new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'});
 let hadir,terlambat,izin,alpha,sample,trend,unitRow,recapNote;
 const days=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
 if(demo){
   hadir=0;terlambat=0;izin=0;alpha=0;
   DATA.forEach(e=>{const s=seed(e.id+'att');if(s<0.86)hadir++;else if(s<0.92)terlambat++;else if(s<0.97)izin++;else alpha++;});
   sample=DATA.slice(0,12).map(e=>{const s=seed(e.id+'att');let st,cls,tin;
     if(s<0.86){st='Hadir';cls='pos';tin='06:'+String(40+Math.floor(seed(e.id+'i')*18)).padStart(2,'0');}
     else if(s<0.92){st='Terlambat';cls='warn';tin='07:'+String(5+Math.floor(seed(e.id+'i')*40)).padStart(2,'0');}
     else if(s<0.97){st='Izin';cls='info';tin='—';}else{st='Alpha';cls='neg';tin='—';}
     return {e,st,cls,tin};});
   trend=days.map((d,i)=>Math.round(TOTAL*(0.80+seed('d'+i)*0.12)));
   unitRow=([u,n])=>{let h=0,t=0,iz=0,a=0;DATA.filter(e=>e.unit===u).forEach(e=>{const s=seed(e.id+'att');if(s<0.86)h++;else if(s<0.92)t++;else if(s<0.97)iz++;else a++;});return {h,t,iz,a,n};};
   recapNote='Angka simulasi (mode Contoh). Alihkan ke Produksi untuk mulai dari nol dan terhubung ke check-in nyata.';
 } else {
   const dstr=new Date().toISOString().slice(0,10);const d0=attCountForDay(dstr);
   hadir=d0.hadir;terlambat=d0.terlambat;
   const cutiToday=loadReq().filter(r=>r.kind==='ajuan'&&r.status==='Disetujui'&&(r.mulai||'')<=dstr&&(r.selesai||r.mulai||'')>=dstr).length;
   izin=cutiToday;alpha=Math.max(0,0);/* alpha dihitung akhir hari; belum check-in ≠ alpha saat berjalan */
   sample=d0.rows.slice(0,15);
   // tren 7 hari nyata
   trend=[...Array(7)].map((_,i)=>{const dd=new Date();dd.setDate(dd.getDate()-(6-i));return attCountForDay(dd.toISOString().slice(0,10)).hadir;});
   const monRec=attScan(monKey);
   unitRow=([u,n])=>{let h=0,t=0;DATA.filter(e=>e.unit===u).forEach(e=>{const r=monRec[e.id];if(r&&r.length){const late=r.some(x=>x.in&&x.in>'07:00');if(late)t++;else h++;}});const iz=loadReq().filter(r=>r.kind==='ajuan'&&r.status==='Disetujui'&&(r.mulai||'').indexOf(monKey)===0&&DATA.find(e=>e.id==r.empId&&e.unit===u)).length;return {h,t,iz,a:0,n};};
   recapNote='Rekap dihitung dari check-in nyata karyawan bulan '+monLbl+'. Kosong = belum ada check-in masuk.';
 }
 const totHadir=hadir+terlambat;
 return `${devBanner('Status presensi. Terhubung ke check-in karyawan (Portal → Presensi). Rekap disiplin dihitung otomatis per bulan.')}
 <div class="grid tiles">
   ${tile('Hadir',fmtID.format(hadir),{color:'var(--pos)',meta:demo?(hadir/TOTAL*100).toFixed(1)+'% dari '+TOTAL:'check-in tepat waktu'})}
   ${tile('Terlambat',fmtID.format(terlambat),{color:'var(--warn)',meta:demo?(terlambat/TOTAL*100).toFixed(1)+'%':'masuk > 07:00'})}
   ${tile('Izin / Sakit',fmtID.format(izin),{color:'var(--info)',meta:demo?(izin/TOTAL*100).toFixed(1)+'%':'cuti/izin disetujui'})}
   ${tile('Belum Presensi',fmtID.format(demo?alpha:Math.max(0,TOTAL-totHadir-izin)),{color:'var(--neg)',meta:'dari '+TOTAL+' karyawan'})}

function buildNetData(){const full=state.netMode==='full';const nodes=[],links=[];
 const hub={id:'HOLDING',label:'AL-WILDAN Holding',type:'hub',col:'#c99a17',count:TOTAL};nodes.push(hub);
 const units=byUnit.slice(0,full?21:16);const maxN=units[0][1]||1;
 units.forEach(([u,n])=>{const rr=10+Math.sqrt(n/maxN)*30;
   const un={id:'U_'+u,label:u,type:'unit',r:rr,col:'#1F4E79',count:n};nodes.push(un);links.push({s:'HOLDING',t:un.id,main:true});
   const emps=DATA.filter(e=>e.unit===u);const take=full?emps.length:Math.min(emps.length,5);
   for(let i=0;i<take;i++){const e=emps[i];const en={id:'E_'+e.id,label:e.nama.split(',')[0],type:'emp',r:4,col:e._local?'#149a63':'#5b8fc9',emp:e};nodes.push(en);links.push({s:un.id,t:en.id});}
 });

function initNetwork(){const stage=document.getElementById('netStage');const cv=document.getElementById('netCanvas');if(!cv||!stage)return;
 const data=buildNetData();const N=data.nodes,L=data.links;const idx={};N.forEach((n,i)=>idx[n.id]=i);
 // adjacency for hover highlighting
 const adj={};L.forEach(l=>{(adj[l.s]=adj[l.s]||new Set()).add(l.t);(adj[l.t]=adj[l.t]||new Set()).add(l.s);});
 const dpr=Math.min(devicePixelRatio||1,2);let W=stage.clientWidth,H=stage.clientHeight||480;
 function resize(){W=stage.clientWidth;H=stage.clientHeight||480;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';}
 resize();
 const units=N.filter(n=>n.type==='unit');
 // group employees per unit + assign fixed orbit angle/radius (deterministic, scalable)
 const empByUnit={};N.forEach(n=>{if(n.type==='emp'){const pl=L.find(l=>l.t===n.id);n._pu=pl?pl.s:null;(empByUnit[n._pu]=empByUnit[n._pu]||[]).push(n);}});
 Object.values(empByUnit).forEach(list=>{const cnt=list.length;const perRing=Math.max(6,Math.ceil(Math.sqrt(cnt)*1.6));list.forEach((n,k)=>{const ring=Math.floor(k/perRing);const inRing=k%perRing;n._ea=(inRing/perRing)*Math.PI*2+ring*0.4;n._er=(n._puR||30)+18+ring*13;});});
 units.forEach((u,ui)=>{const a=ui/units.length*Math.PI*2;const rad=Math.min(W,H)*0.34;u.x=W/2+Math.cos(a)*rad;u.y=H/2+Math.sin(a)*rad;u.vx=0;u.vy=0;u._a=a;});
 N.forEach(n=>{if(n.type==='hub'){n.x=W/2;n.y=H/2;}else if(n.type==='emp'){const pu=n._pu?N[idx[n._pu]]:null;n._er=(pu?pu.r:20)+16+ (n._er||0);n.x=(pu?pu.x:W/2)+Math.cos(n._ea)*n._er;n.y=(pu?pu.y:H/2)+Math.sin(n._ea)*n._er;}n.vx=0;n.vy=0;});
 const view={x:0,y:0,k:1};let dragNode=null,panning=false,last=null,hoverNode=null,pulse=0,hi=null;
 NET={view,resize,stop:false,cv,setHi:v=>{hi=v;}};
 const empCount=N.filter(n=>n.type==='emp').length;
 function tick(){if(!NET||NET.stop)return;pulse+=0.02;
   const hub=N[0];hub.x=W/2;hub.y=H/2;
   // unit-unit repulsion (few nodes) + spring to ring slot
   for(let i=0;i<units.length;i++){const a=units[i];
     for(let j=i+1;j<units.length;j++){const b=units[j];let dx=a.x-b.x,dy=a.y-b.y;let d2=dx*dx+dy*dy;if(d2<1)d2=1;const d=Math.sqrt(d2);if(d<300){const f=9000/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}}
     const rad=Math.min(W,H)*0.34;const tx=W/2+Math.cos(a._a)*rad,ty=H/2+Math.sin(a._a)*rad;a.vx+=(tx-a.x)*0.03;a.vy+=(ty-a.y)*0.03;a.vx*=0.8;a.vy*=0.8;if(a!==dragNode){a.x+=a.vx;a.y+=a.vy;}}
   // employees follow their unit at fixed orbit (cheap & stable for full graph)
   N.forEach(n=>{if(n.type!=='emp'||n===dragNode)return;const pu=n._pu?N[idx[n._pu]]:hub;const ang=n._ea+pulse*0.04;const tx=pu.x+Math.cos(ang)*n._er,ty=pu.y+Math.sin(ang)*n._er;n.x+=(tx-n.x)*0.25;n.y+=(ty-n.y)*0.25;});
   draw();requestAnimationFrame(tick);}
 function nodeVisible(n){if(!hi)return true;if(n.type==='hub')return true;return (n.label.toLowerCase().includes(hi)||(n.type==='unit'&&n.id.toLowerCase().includes('u_'+hi)));}
 function draw(){const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
   c.save();c.translate(view.x,view.y);c.scale(view.k,view.k);
   const focus=hoverNode;const showNames=view.k>1.15;
   // edges as neural synapse curves with animated flow
   L.forEach((l,li)=>{const a=N[idx[l.s]],b=N[idx[l.t]];
     const related=focus&&(l.s===focus.id||l.t===focus.id);
     const dim=(focus&&!related)||(hi&&!(nodeVisible(a)&&nodeVisible(b)));
     const dx=b.x-a.x,dy=b.y-a.y;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const nx=-dy,ny=dx;const nl=Math.hypot(nx,ny)||1;const bow=(l.main?0:16)*(li%2?1:-1);const cxp=mx+nx/nl*bow,cyp=my+ny/nl*bow;
     c.strokeStyle=related?'rgba(201,154,23,0.8)':(l.main?'rgba(31,78,121,'+(dim?0.06:0.4)+')':'rgba(91,143,201,'+(dim?0.04:0.16)+')');
     c.lineWidth=(related?2.2:l.main?1.4+Math.min(3,a.count?0:(b.count||0)/120):0.6)/view.k;
     c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(cxp,cyp,b.x,b.y);c.stroke();
     // synapse pulse dot travelling along the edge
     if((related||(!focus&&!dim))&&(l.main||related)){const t=((pulse* (related?1.2:0.5))+li*0.13)%1;const it=1-t;const px=it*it*a.x+2*it*t*cxp+t*t*b.x;const py=it*it*a.y+2*it*t*cyp+t*t*b.y;
       c.beginPath();c.fillStyle=related?'rgba(201,154,23,0.95)':'rgba(31,78,121,0.5)';c.arc(px,py,(related?2.6:1.6)/view.k,0,7);c.fill();}
   });
   // nodes
   N.forEach(n=>{const related=focus&&(n===focus||(adj[focus.id]&&adj[focus.id].has(n.id)));

     else if(n.type==='unit'){c.fillStyle='#1F4E79';c.shadowColor='#4b83c4';c.shadowBlur=related?22:12;c.arc(n.x,n.y,n.r,0,7);}
     else{c.fillStyle=n.col;c.shadowColor=n.col;c.shadowBlur=related?10:0;c.arc(n.x,n.y,n.r*(related?1.4:1),0,7);}

     // labels
     c.globalAlpha=dim?0.25:1;
     if(n.type==='hub'){c.font='800 13px Plus Jakarta Sans, sans-serif';c.textAlign='center';c.fillStyle='#7a5c05';c.fillText(n.label,n.x,n.y+n.r+16);}
     else if(n.type==='unit'){c.font='800 12px Plus Jakarta Sans, sans-serif';c.textAlign='center';
       c.lineWidth=3;c.strokeStyle='rgba(255,255,255,0.9)';c.strokeText(n.label,n.x,n.y+n.r+14);c.fillStyle='#123a5c';c.fillText(n.label,n.x,n.y+n.r+14);}
     else if(showNames||related){c.font='600 10px Plus Jakarta Sans, sans-serif';c.textAlign='center';c.lineWidth=2.6;c.strokeStyle='rgba(255,255,255,0.92)';c.strokeText(n.label,n.x,n.y+n.r+9);c.fillStyle='#254a6b';c.fillText(n.label,n.x,n.y+n.r+9);}

   });c.restore();}
 function toWorld(px,py){return {x:(px-view.x)/view.k,y:(py-view.y)/view.k};}
 function pick(px,py){const w=toWorld(px,py);let best=null,bd=1e9;N.forEach(n=>{const dx=n.x-w.x,dy=n.y-w.y;const d=dx*dx+dy*dy;const rr=(n.r+6)*(n.r+6);if(d<rr&&d<bd){bd=d;best=n;}});return best;}
 cv.onmousedown=e=>{const r=cv.getBoundingClientRect();const p={x:e.clientX-r.left,y:e.clientY-r.top};const n=pick(p.x,p.y);if(n&&n.type!=='hub'){dragNode=n;cv.style.cursor='grabbing';}else{panning=true;}last=p;};

/* SHA-256 murni JS — dipakai bila crypto.subtle tidak ada (mis. situs diakses via http:// non-secure).
   Menghasilkan hash IDENTIK dengan crypto.subtle, jadi akun lama (yang ter-hash saat masih https/localhost) tetap bisa login. */
function _sha256js(ascii){function rr(v,a){return (v>>>a)|(v<<(32-a));}var mp=Math.pow,maxWord=mp(2,32),i,j,result='',words=[];var asciiBitLength=ascii.length*8;var hash=_sha256js.h=_sha256js.h||[],k=_sha256js.k=_sha256js.k||[];var primeCounter=k.length,isComposite={};for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(i=0;i<313;i+=candidate){isComposite[i]=candidate;}hash[primeCounter]=(mp(candidate,.5)*maxWord)|0;k[primeCounter++]=(mp(candidate,1/3)*maxWord)|0;}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=(asciiBitLength);for(j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2];var a=hash[0],e=hash[4];var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}return result;}
async function sha256(s){try{if(typeof crypto!=='undefined'&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}return _sha256js(unescape(encodeURIComponent(s)));}
function loadAccts(){try{return JSON.parse(localStorage.getItem(ACC_KEY))||[]}catch(e){return[]}}
function saveAccts(a){try{localStorage.setItem(ACC_KEY,JSON.stringify(a))}catch(e){}}
async function ensureSeedAccounts(){let accs=loadAccts();if(accs.length)return accs;
 // seed: 1 master admin. Password default: alwildan2026
 const ph=await sha256('alwildan2026');
 accs=[{u:'admin',ph,role:'master',nama:'Kemal Prabowo, M.Si.',unit:'Holding',empId:null}];
 saveAccts(accs);return accs;}
function slugUser(e){return (e.email?e.email.split('@')[0]:('aw'+String(e.id).replace(/\D/g,''))).toLowerCase().replace(/[^a-z0-9._-]/g,'');}
/* ---- password kuat & unik (12 char, hindari ambigu) ---- */
function randPassword(len){len=len||12;const U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghijkmnpqrstuvwxyz',D='23456789',S='!@#$%*?+';const all=U+L+D+S;
 const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};
 let p=[U[rnd(U.length)],L[rnd(L.length)],D[rnd(D.length)],S[rnd(S.length)]];
 for(let i=p.length;i<len;i++)p.push(all[rnd(all.length)]);
 for(let i=p.length-1;i>0;i--){const j=rnd(i+1);[p[i],p[j]]=[p[j],p[i]];}
 return p.join('');}
/* ---- NIP: AW.<cabang>.<thn masuk>.<urut per cabang+thn> ---- */
function unitCode(u){const m=String(u||'').match(/(\d+)/);if(m)return m[1].padStart(2,'0');const t=String(u||'').toUpperCase();if(t.includes('HOLDING'))return 'HO';if(t.includes('LINTAS'))return 'LX';if(t.includes('YAYASAN'))return 'YY';return 'XX';}
function genNIP(e,taken){const cab=unitCode(e.unit);const thn=/^\d{4}$/.test(e.thnAktif)?e.thnAktif:String(NOW_YEAR);
 // urutan stabil: kumpulkan karyawan di cabang+thn yang sama, urut by id numerik, cari slot pertama yang bebas
 let seq=1;const prefix='AW.'+cab+'.'+thn+'.';
 while(taken&&taken.has(prefix+String(seq).padStart(4,'0')))seq++;
 return prefix+String(seq).padStart(4,'0');}
function allNIPs(){const s=new Set();DATA.forEach(e=>{if(e.nip)s.add(e.nip);});return s;}
function currentEmp(){if(!SESSION||!SESSION.empId)return null;return DATA.find(x=>x.id==SESSION.empId)||null;}
